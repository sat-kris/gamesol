<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stillz: short games that build patience and focus instead of stealing your attention.">
<meta name="theme-color" content="#0B1A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stillz">
<meta property="og:title" content="Stillz">
<meta property="og:description" content="Games that build your attention instead of stealing it.">
<meta property="og:image" content="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Stillz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0B1A1F; --surface:#112930; --surface2:#16333B; --line:#24464F;
  --text:#E6F0EC; --muted:#93ADA9; --sea:#8EDCC0; --aura:#FFB98A; --danger:#FF7A6B;
  --fd:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --fb:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

.shell{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;border-inline:1.5px solid transparent}
@media (min-width:600px){.shell{border-color:var(--line)}}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-inline:16px;padding-block:0 28px}
.view[hidden]{display:none!important}
.vstack{display:flex;flex-direction:column;gap:18px}

.top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--fd);letter-spacing:-.02em;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.glow{width:9px;height:9px;border-radius:50%;background:var(--aura);box-shadow:0 0 10px 2px rgba(255,185,138,.55)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 16px/1 var(--fd);color:#0B1A1F;flex:none}
.av.lg{width:56px;height:56px;font-size:24px}
.h-title{font:800 28px/1.05 var(--fd);letter-spacing:-.02em;margin:0}

.hero h1{font:800 clamp(28px,8.4vw,42px)/1.04 var(--fd);letter-spacing:-.03em;margin:4px 0 10px;text-wrap:balance}
.hero h1 s{color:var(--muted);text-decoration-thickness:3px;text-decoration-color:var(--aura)}
.hero p{margin:0;color:var(--muted);font-size:15px;max-width:44ch}

.box{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px}
.lvl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvl-name{font:800 24px/1.1 var(--fd);letter-spacing:-.02em}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar-track{height:10px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line);margin:10px 0 6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--sea),var(--aura));border-radius:99px}
.small{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.daily{display:flex;align-items:center;gap:14px;background:var(--surface2);border-color:rgba(255,185,138,.45);text-align:left;width:100%}
.daily .ic{width:52px;height:52px;flex:none;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:var(--aura)}
.daily .ic svg{width:30px;height:30px}
.daily .txt{flex:1;min-width:0}
.daily .nm{font:700 20px/1.15 var(--fd)}
.daily .go{background:var(--aura);color:#1d1208;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;flex:none}

.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.cat-h h2{font:800 22px/1 var(--fd);margin:0;letter-spacing:-.02em}
.cat-h span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:border-color .15s}
.card:active{border-color:var(--sea)}
@media (hover:hover){.card:hover{border-color:var(--sea)}}
.card .ic{color:var(--sea);width:32px;height:32px}
.card .nm{font:700 19px/1.1 var(--fd);margin-top:2px}
.card .bl{font-size:13.5px;color:var(--muted);line-height:1.35;flex:1}
.card .bs{font-size:13px;color:var(--aura);font-weight:600;font-variant-numeric:tabular-nums;min-height:1.2em}
.foot{color:var(--muted);font-size:13px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font:800 24px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.prof{display:flex;align-items:center;gap:14px}
.prof .nick{font:800 24px/1.1 var(--fd);letter-spacing:-.02em}
.split{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:10px;font-size:14px}
.hrow .tr{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.hrow .fl{height:100%;border-radius:6px;background:var(--sea)}
.hrow .fl.a{background:var(--aura)}
.hrow .v{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;min-width:3ch;text-align:right}
.chart svg{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1.5px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:26px;height:26px;color:var(--sea);flex:none}
.lrow .nm{flex:1;font-weight:600}
.lrow .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--aura)}
.lrow .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.rank{width:28px;font:800 18px/1 var(--fd);color:var(--muted);text-align:center;flex:none}
.lrow.me{background:var(--surface2);border-radius:14px;padding-inline:10px;border-bottom-color:transparent}
.lrow.me .rank{color:var(--aura)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.chipb[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#08201a}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;border:1.5px solid var(--line);background:transparent;min-height:48px}
.btn.pri{background:var(--sea);border-color:var(--sea);color:#08201a}
.btn.full{width:100%}
.note{font-size:14px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:14px}

/* tabs */
.tabs{display:flex;border-top:1.5px solid var(--line);background:var(--bg);flex:none}
.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;min-height:60px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--sea)}
.tabs button[hidden]{display:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(6,14,17,.72);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none!important}
.sheet form{background:var(--surface);border:1.5px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font:800 26px/1.1 var(--fd);margin:0}
.sheet input[type=text]{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;min-height:50px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--text)}
.swatches input:focus-visible+span{outline:2px solid var(--sea);outline-offset:2px}
.prow{display:flex;gap:10px}

/* stage */
#stage{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#stage[hidden]{display:none!important}
.sbar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1.5px solid var(--line);max-width:560px;width:100%;margin:0 auto}
#stTitle{font:800 20px/1 var(--fd);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{font-weight:600;font-variant-numeric:tabular-nums;color:var(--aura);font-size:15px;white-space:nowrap}
.cvwrap{position:relative;flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#panel{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(11,26,31,.78);overflow-y:auto}
#panel[hidden]{display:none!important}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:22px 20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.pcard .ic{width:48px;height:48px;color:var(--sea)}
.pcard h3{font:800 30px/1 var(--fd);margin:0;letter-spacing:-.02em}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea);font-weight:600}
.pcard p{margin:0;color:var(--muted);font-size:15px}
.big{font:800 52px/1 var(--fd);color:var(--aura);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;width:100%;margin-top:6px}
.btns .btn{flex:1}
.nudge{border-top:1.5px solid var(--line);padding-top:12px;width:100%;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="shell">
  <main class="view" id="v-play" aria-label="Play"></main>
  <main class="view" id="v-score" aria-label="Scorecard" hidden></main>
  <main class="view" id="v-rank" aria-label="Ranking" hidden></main>
  <main class="view" id="v-cockpit" aria-label="Cockpit" hidden></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Play</button>
    <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Scorecard</button>
    <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Ranking</button>
    <button data-tab="cockpit" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M4 20h16"/></svg>Cockpit</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <form id="pform" autocomplete="off">
    <h3 id="sheetTitle">Who's playing?</h3>
    <p class="small" style="margin:0">Pick a nickname. Use a made-up name, not your real one.</p>
    <input type="text" id="nick" maxlength="16" placeholder="e.g. CalmFox" required aria-label="Nickname">
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
    <div class="prow"><button type="button" class="btn" id="cancelP">Cancel</button><button type="submit" class="btn pri" style="flex:1">Let's go</button></div>
  </form>
</div>

<div id="stage" hidden>
  <div class="sbar">
    <button class="icon-btn" id="back" aria-label="Back to games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="stTitle"></div>
    <div id="hud"></div>
  </div>
  <div class="cvwrap"><canvas id="cv"></canvas><div id="panel" hidden></div></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={bg:'#0B1A1F',surface:'#112930',surface2:'#16333B',line:'#24464F',text:'#E6F0EC',muted:'#93ADA9',sea:'#8EDCC0',aura:'#FFB98A',danger:'#FF7A6B'};
const FD='"Bricolage Grotesque", system-ui, sans-serif', FB='"Figtree", system-ui, sans-serif';
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const hearts=n=>'●'.repeat(Math.max(0,n))+'○'.repeat(Math.max(0,3-n));
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,Math.PI*2);}
function txt(c,s,x,y,size,col,w=600,font=FB,align='center'){c.font=`${w} ${size}px ${font}`;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y);}
const dayStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dayStr(new Date());

/* ---------- storage ---------- */
const KEY='stillz:v2';
let S={v:2,players:{},cur:null,sound:true,days:{},starts:{},rest:{shown:0,taken:0},firstSeen:today()};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));
 else{const old=localStorage.getItem('stillz:v1');if(old){const o=JSON.parse(old);const id='p'+Date.now().toString(36);S.players[id]={id,nick:'Player 1',color:'#8EDCC0',aura:o.aura||0,best:o.best||{},plays:o.plays||{},streak:o.streak||{last:null,count:0},log:[]};S.cur=id;S.sound=o.sound!==false;}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const P=()=>S.players[S.cur]||null;
function dayRec(d){return S.days[d]||(S.days[d]={visits:0,plays:0,ms:0,aura:0});}
dayRec(today()).visits++;save();

/* ---------- sound ---------- */
let ac=null;
function tone(f,d=.15,type='sine',v=.07){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
const sfx={good(){tone(660,.18);setTimeout(()=>tone(990,.24),70)},bad(){tone(170,.32,'triangle',.09)},tick(){tone(520,.07,'sine',.035)},soft(){tone(440,.5,'sine',.05)},end(){tone(523,.3);setTimeout(()=>tone(659,.3),120);setTimeout(()=>tone(784,.5),240)}};

/* ---------- icons ---------- */
const I={
 bloom:'<path d="M16 17c-4-1-7-4-6-8 3 0 5 2 6 5 1-3 3-5 6-5 1 4-2 7-6 8z"/><path d="M16 17c0-4 0-8 0-11"/><path d="M16 17v10"/><path d="M16 23c-3-2-6-2-8 0M16 21c3-2 6-2 8 0"/>',
 settle:'<circle cx="16" cy="14" r="10"/><path d="M10 27h12M13 24v3M19 24v3"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/><circle cx="16" cy="20" r="1.2" fill="currentColor"/><circle cx="20" cy="19" r="1.2" fill="currentColor"/><circle cx="14" cy="17" r="1.2" fill="currentColor"/><circle cx="18" cy="17" r="1.2" fill="currentColor"/>',
 breathe:'<circle cx="16" cy="16" r="4"/><circle cx="16" cy="16" r="8.5" stroke-dasharray="2 3"/><circle cx="16" cy="16" r="13"/>',
 carry:'<path d="M8 10h16l-2 17H10z"/><path d="M9.2 17c2.2-1.5 4.4 1.5 6.8 0s4.6-1.5 6.8 0"/><path d="M26 6c-1 2-3 2-4 0"/>',
 hold:'<circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="3.5" fill="currentColor"/><path d="M24 5l3-2M26 9l3 0"/>',
 track:'<circle cx="8" cy="10" r="3"/><circle cx="23" cy="8" r="3"/><circle cx="10" cy="24" r="3"/><circle cx="22" cy="21" r="3" fill="currentColor"/><circle cx="22" cy="21" r="7"/>',
 clash:'<path d="M5 25l6-18 6 18M7.5 19h7"/><rect x="19" y="14" width="9" height="11" rx="2.5" fill="currentColor"/>',
 only:'<circle cx="10" cy="16" r="6" fill="currentColor"/><rect x="18" y="10" width="11" height="11" rx="2.5"/><path d="M17 26l13-19"/>'
};
const icon=id=>`<svg class="ic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[id]}</svg>`;
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#8EDCC0" stroke-width="2.5"/><circle cx="16" cy="16" r="4.5" fill="#FFB98A"/></svg>';

/* ================= GAMES ================= */
const GAMES=[];

/* ---- BLOOM: tap exactly when it blooms ---- */
GAMES.push({id:'bloom',name:'Bloom',cat:'Patience',trains:'Waiting for the right moment',
 blurb:'Wait for the moment, not the urge.',
 how:'The bud opens slowly. Tap the moment it fully blooms. Tap early and it closes. Some buds will try to fake you out.',
 fmt:s=>s+(s===1?' bloom':' blooms'),
 create(a){
  let round=0,lives=3,score=0,prog=0,T=3,Wd=.9,bt=0,phase='grow',fb=0,fake=null,shiver=0;
  function next(){round++;T=rnd(2.2,4.2)+Math.min(round,12)*.28;Wd=Math.max(.42,.95-round*.04);prog=0;bt=0;phase='grow';fake=round>2&&Math.random()<.55?rnd(.35,.75):null;shiver=0;}
  function hud(){a.hud(`${score} · ${hearts(lives)}`)}
  function lose(msg){lives--;a.sfx.bad();a.toast(msg,C.danger);phase='fb';fb=1;hud();}
  next();hud();
  return{
   update(dt){
    if(phase==='grow'){prog+=dt/T;if(fake!=null&&Math.abs(prog-fake)<.04)shiver=.35;shiver=Math.max(0,shiver-dt);if(prog>=1){prog=1;phase='bloom';a.sfx.soft();}}
    else if(phase==='bloom'){bt+=dt;if(bt>Wd)lose('It wilted. Tap sooner once it opens.');}

     if(tgt){circ(c,d.x,d.y,R+8+Math.sin(performance.now()/150)*3);c.strokeStyle=C.aura;c.lineWidth=2;c.stroke();}});

/* ---- CLASH: tap the ink, not the word ---- */
GAMES.push({id:'clash',name:'Clash',cat:'Focus',trains:'Ignoring the obvious distraction',
 blurb:'Your brain reads first. Beat the reflex.',
 how:'Tap the color of the ink, not the word. RED written in blue means tap blue. Wrong taps cost a point. You have 40 seconds.',
 fmt:s=>s+' net',
 create(a){
  const K=[{n:'RED',c:'#FF7A6B'},{n:'BLUE',c:'#6BB8FF'},{n:'GREEN',c:'#7BE0A8'},{n:'YELLOW',c:'#FFD36B'}];
  let left=40,ok=0,bad=0,w=0,k=0,shake=0,ended=false,flash=0;
  function next(){w=Math.floor(Math.random()*4);do{k=Math.floor(Math.random()*4);}while(k===w&&Math.random()<.8);}
  const btns=()=>{const y0=a.h*.52,gap=14,bw=Math.min(180,(a.w-40-gap)/2),bh=Math.min(96,(a.h-y0-30-gap)/2),x0=(a.w-bw*2-gap)/2;return K.map((_,i)=>({x:x0+(i%2)*(bw+gap),y:y0+Math.floor(i/2)*(bh+gap),w:bw,h:bh}));};
  next();
  return{
   update(dt){if(ended)return;left-=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);a.hud(`${Math.ceil(left)}s · ${ok-bad}`);
    if(left<=0){ended=true;const net=ok-bad;a.end({score:net,text:`${ok} correct, ${bad} ${bad===1?'slip':'slips'}.`,aura:Math.max(0,net)});}},
   down(x,y){if(ended)return;btns().forEach((b,i)=>{if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(i===k){ok++;a.sfx.tick();flash=.15;}else{bad++;a.sfx.bad();shake=.3;}next();}});},
   draw(c){
    c.fillStyle=C.surface;c.fillRect(0,0,a.w,6);c.fillStyle=C.sea;c.fillRect(0,0,a.w*clamp(left/40,0,1),6);
    const sx=shake>0?Math.sin(performance.now()/18)*8:0;
    txt(c,K[w].n,a.w/2+sx,a.h*.27,Math.min(92,a.w*.17),K[k].c,800,FD);
    txt(c,'Tap the ink color',a.w/2,a.h*.43,15,C.muted,600);
    btns().forEach((b,i)=>{rr(c,b.x,b.y,b.w,b.h,18);c.fillStyle=K[i].c;c.fill();});
    if(flash>0){c.fillStyle=`rgba(142,220,192,${flash})`;c.fillRect(0,0,a.w,a.h);}
   }
  };
 }});

GAMES.push({id:'only',name:'Only',cat:'Focus',trains:'Impulse control',
 blurb:'The hardest move is not moving.',

 create(a){
  let lives=3,score=0,held=0,phase='gap',pt=1.2,go=true,win=.9,ox=0,oy=0,fb=0;

    else if(phase==='show'&&pt<=0){if(go)lose('Missed a circle');else{held++;phase='gap';pt=rnd(.5,1.3);}}

   },
   down(){if(phase==='gap')lose('Too eager. Wait for it.');else if(phase==='show'){if(go){score++;a.sfx.tick();phase='gap';pt=rnd(.5,1.3);hud();}else lose('That was a square');}},
   draw(c){
    const cx=a.w/2+ox,cy=a.h/2+oy,s=Math.min(a.w,a.h)/420;

    else if(phase==='gap'){circ(c,a.w/2,a.h/2,4);c.fillStyle=C.line;c.fill();}

function dailyId(){const d=new Date(),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);return ALL[n%ALL.length];}
function yday(){const y=new Date();y.setDate(y.getDate()-1);return dayStr(y);}
function streakTouch(p){const t=today();if(p.streak.last===t)return;p.streak.count=p.streak.last===yday()?p.streak.count+1:1;p.streak.last=t;p.streak.max=Math.max(p.streak.max||0,p.streak.count);}
function streakShown(p){return p&&(p.streak.last===today()||p.streak.last===yday())?p.streak.count:0;}

function barChart(rows,col){ // rows [{label, value, tip}]
 const Wd=320,Hd=150,pad={l:6,r:6,t:18,b:22},n=rows.length,max=Math.max(1,...rows.map(r=>r.value));
 const bw=(Wd-pad.l-pad.r)/n,ih=Hd-pad.t-pad.b;
 let s=`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${esc(rows.map(r=>r.label+': '+r.value).join(', '))}">`;
 s+=`<line x1="${pad.l}" x2="${Wd-pad.r}" y1="${pad.t+ih}" y2="${pad.t+ih}" stroke="${C.line}" stroke-width="1.5"/>`;
 s+=`<text x="${pad.l}" y="10" fill="${C.muted}" font-size="10" font-family="Figtree,sans-serif">max ${max}</text>`;
 rows.forEach((r,i)=>{const h=r.value/max*ih,x=pad.l+i*bw+2,w=Math.max(2,bw-4),y=pad.t+ih-h;
  s+=`<g><title>${esc(r.tip||r.label+': '+r.value)}</title><rect x="${x-2}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  if(r.value>0)s+=`<path d="M${x},${pad.t+ih}V${y+Math.min(4,h)}q0,-${Math.min(4,h)} ${Math.min(4,w/2)},-${Math.min(4,h)}H${x+w-Math.min(4,w/2)}q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,h)}V${pad.t+ih}Z" fill="${col||C.sea}"/>`;
  s+=`</g>`;
  const stp=Math.ceil(n/6);if((i%stp===0&&n-1-i>=stp)||i===n-1)s+=`<text x="${x+w/2}" y="${Hd-6}" fill="${C.muted}" font-size="10" text-anchor="middle" font-family="Figtree,sans-serif">${esc(r.label)}</text>`;});
 return s+'</svg>';}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({key:dayStr(d),label:i===0?'Today':d.toLocaleDateString(undefined,{day:'numeric',month:'short'})});}return out;}
const hrows=(rows,cls)=>{const max=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div class="hrow"><span>${esc(r.k)}</span><span class="tr"><span class="fl ${cls||''}" style="width:${r.v/max*100}%;display:block"></span></span><span class="v">${r.t??r.v}</span></div>`).join('');};

function resize(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;dpr=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
new ResizeObserver(resize).observe(cv);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
const api={get w(){return W},get h(){return H},hud:t=>{hudEl.textContent=t},sfx,toast:(t,col)=>{toasts=[{t,col:col||C.text,age:0}];},end:res=>{if(done)return;done=true;setTimeout(()=>result(res),700);}};

let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');}else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}}
function openGame(id){def=G(id);stage.hidden=false;$('#stTitle').textContent=def.name;hudEl.textContent='';inst=null;done=false;toasts=[];requestAnimationFrame(resize);intro();if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}keepAwake(true);}
function closeGame(){stage.hidden=true;cancelAnimationFrame(raf);raf=0;inst=null;panel.hidden=true;keepAwake(false);render();}
function intro(){panel.hidden=false;const daily=def.id===dailyId();
 panel.innerHTML=`<div class="pcard">${icon(def.id)}<h3>${def.name}</h3><span class="chip">Trains: ${def.trains}</span><p>${def.how}</p>${daily?'<p style="color:var(--aura)">Today\'s pick: 2× aura.</p>':''}<div class="btns"><button class="btn pri" id="startB">Start</button></div></div>`;
 $('#startB').onclick=begin;}
function begin(){resize();panel.hidden=true;toasts=[];done=false;runMs=0;S.starts[def.id]=(S.starts[def.id]||0)+1;save();inst=def.create(api);sfx.tick();}
function result(res){
 const p=P();let aura=Math.max(0,Math.round(res.aura||0));const daily=def.id===dailyId();if(daily)aura*=2;
 const prev=p.best[def.id],isBest=prev==null||res.score>prev;if(isBest)p.best[def.id]=res.score;
 p.aura+=aura;p.plays[def.id]=(p.plays[def.id]||0)+1;streakTouch(p);
 p.log.push({t:Date.now(),g:def.id,s:res.score,a:aura,ms:Math.round(runMs)});if(p.log.length>600)p.log=p.log.slice(-600);
 const d=dayRec(today());d.plays++;d.aura+=aura;save();sfx.end();
 const showNudge=!nudged&&playMs>15*60*1000;if(showNudge){nudged=true;S.rest.shown++;save();}
 panel.hidden=false;
 panel.innerHTML=`<div class="pcard"><span class="lbl">${esc(p.nick)} · ${def.name}</span><div class="big">+${aura}</div><span class="lbl" style="color:var(--aura)">aura${daily?' · doubled today':''}</span>
  <p style="color:var(--text)">${res.text}</p><p class="small">${isBest?'New personal best':'Best: '+def.fmt(p.best[def.id])}</p>
  ${showNudge?`<div class="nudge"><span>You've played for 15 minutes. Nice focus. Rest your eyes for 20 seconds and earn 5 aura.</span><button class="btn" id="restB">Rest 20 seconds</button></div>`:''}
  <div class="btns"><button class="btn" id="homeB">All games</button><button class="btn pri" id="againB">Again</button></div></div>`;
 $('#againB').onclick=begin;$('#homeB').onclick=closeGame;
 const rb=$('#restB');if(rb)rb.onclick=()=>{let n=20;rb.disabled=true;S.rest.taken++;save();const tick=()=>{rb.textContent=n>0?`Look at something far away… ${n}`:'Rested. +5 aura';if(n<=0){p.aura+=5;save();sfx.good();return;}n--;setTimeout(tick,1000);};tick();};
}
$('#back').addEventListener('click',closeGame);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!stage.hidden)closeGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(!stage.hidden){wake=null;keepAwake(true);}});

function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(inst&&!done&&!document.hidden){inst.update(dt);playMs+=dt*1000;runMs+=dt*1000;dayRec(today()).ms+=dt*1000;}
 for(const t of toasts)t.age+=dt;toasts=toasts.filter(t=>t.age<1.4);
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
 if(inst)inst.draw(ctx);
 for(const t of toasts){const al=t.age>1?(1.4-t.age)/.4:1;ctx.globalAlpha=al;ctx.font=`700 17px ${FD}`;const tw=Math.min(W-24,ctx.measureText(t.t).width+32),x=(W-tw)/2,y=H*.2-t.age*8;rr(ctx,x,y-19,tw,38,19);ctx.fillStyle=C.surface2;ctx.fill();ctx.strokeStyle=t.col;ctx.lineWidth=1.5;ctx.stroke();txt(ctx,t.t,W/2,y,17,t.col,700,FD);ctx.globalAlpha=1;}
 raf=requestAnimationFrame(frame);
}
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{if(!inst||done)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pt(e);inst.down&&inst.down(p.x,p.y,e);e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!inst||done)return;const p=pt(e);inst.move&&inst.move(p.x,p.y,e);});
const up=e=>{if(!inst||done)return;const p=pt(e);inst.up&&inst.up(p.x,p.y,e);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

window.addEventListener('hashchange',()=>{if(location.hash==='#cockpit'){S.cockpit=true;save();setTab('cockpit');}});
if(location.hash==='#cockpit'){S.cockpit=true;save();}
setTab(location.hash==='#cockpit'?'cockpit':'play');
if(!Object.keys(S.players).length)openSheet(false);
})();
</script>

</body>
</html>
