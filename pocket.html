<body>
<div class="shell">
  <main class="view" id="v-play" aria-label="Play"></main>
  <main class="view" id="v-score" aria-label="Scorecard" hidden></main>
  <main class="view" id="v-rank" aria-label="Ranking" hidden></main>
  <main class="view" id="v-labs" aria-label="New games" hidden></main>
  <main class="view" id="v-learn" aria-label="Learn" hidden></main>
  <main class="view" id="v-cockpit" aria-label="Cockpit" hidden></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="17.5" cy="13.5" r="1" fill="currentColor"/></svg>Play</button>
    <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Scorecard</button>
    <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Ranking</button>
    <button data-tab="labs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>New</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>Learn</button>
    <button data-tab="cockpit" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M4 20h16"/></svg>Cockpit</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <form id="pform" autocomplete="off">
    <h3 id="sheetTitle">Welcome to Pocket Plays</h3>
    <div id="plist"></div>
    <p class="small" style="margin:0" id="nickHelp">Add a nickname for your scorecard, or skip it and start playing. Use a made-up name, not your real one.</p>
    <input type="text" id="nick" maxlength="16" placeholder="Nickname (optional)" aria-label="Nickname (optional)" autocapitalize="words" enterkeyhint="go">
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
    <div class="prow"><button type="button" class="btn" id="cancelP">Skip</button><button type="submit" class="btn pri" style="flex:1">Let's play</button></div>
  </form>
</div>

<div id="stage" hidden>

    <div id="stTitle"></div>
    <div id="hud"></div>

  </div>
  <div class="cvwrap"><canvas id="cv"></canvas><div id="panel" hidden></div></div>
</div>

 balloon grows, and out while it shrinks. 5 calm breaths.",fmt:e=>e+"/5",create(e){let t=0,a=0,n=!1,s="in";return e.hud("Breath 1 of 5"),F(392,.5,"sine",.04),{update(o){if(!n)if(a+=o,"in"===s&&a>=4)s="out",a=0,F(330,.5,"sine",.04);else if("out"===s&&a>=5){if(t++,t>=5)return n=!0,void e.end({score:5,text:"Five calm breaths. Well done.",xp:8});s="in",a=0,F(392,.5,"sine",.04),e.hud(`Breath ${t+1} of 5`)}},draw(n){et(n,e,"in"===s?"Breathe in…":"Breathe out…");const i="in"===s?a/4:1-a/5,r=.5-.5*Math.cos(Math.PI*i),l=Math.min(e.w,e.h)*(.12+.2*r),h=.5*e.h;n.strokeStyle=o,n.lineWidth=2.5,n.beginPath(),n.moveTo(e.w/2,h+l),n.quadraticCurveTo(e.w/2-20,h+l+60,e.w/2,h+l+110),n.stroke(),n.beginPath(),n.ellipse(e.w/2,h,.92*l,l,0,0,2*Math.PI),n.fillStyle="#9CC9E8",n.fill(),n.lineWidth=4,n.stroke(),k(n,e.w/2-.35*l,h-.4*l,.12*l),n.fillStyle="rgba(255,255,255,.7)",n.fill();for(let a=0;a<5;a++)q(n,e.w/2+34*(a-2),e.h-44,12),n.fillStyle=a<t?d:"#DDE3E7",n.fill(),H(n,2)},finish(){n||(n=!0,e.end({score:t,text:`${t} calm breaths.`,xp:t}))}}}});const tt="Valmiki’s Ramayana",at="Vyasa’s Mahabharata",nt={e_krauncha:{t:"The first verse",tt:"మొదటి శ్లోకం",src:"Bala Kanda",book:tt,s:"Sage Valmiki was walking by the Tamasa river when he saw a pair of krauncha birds. A hunter shot one of them, and its mate cried out in grief. Moved by sorrow (śoka), Valmiki spoke a verse in a perfect rhythm: the first śloka. Brahma then asked him to tell the story of Rama in this new metre."},e_lava:{t:"Lava and Kusha sing the Ramayana",tt:"లవకుశుల గానం",src:"Bala Kanda",book:tt,s:"Valmiki taught the finished poem of 24,000 verses to two young disciples, Lava and Kusha, who sang it sweetly to the music of the veena. They later sang it in Rama’s own court, where everyone listened in wonder."},e_yajna:{t:"Guarding Vishwamitra’s yajna",tt:"విశ్వామిత్రుని యజ్ఞ రక్షణ",src:"Bala Kanda",book:tt,s:"Sage Vishwamitra asked King Dasharatha to send young Rama to protect his yajna from rakshasas. Rama and Lakshmana went with him. On the way the sage taught them the mantras Bala and Atibala, and later gave Rama divine weapons. Rama defeated Tataka, and at the yajna he drove away Maricha and defeated Subahu."},e_bow:{t:"Shiva’s bow",tt:"శివ ధనుస్సు",src:"Bala Kanda",book:tt,s:"In Mithila, King Janaka kept a mighty bow of Shiva that no king could even lift. Janaka had found Sita in a furrow while ploughing a field, and promised her hand to whoever could string the bow. Rama lifted it with ease and strung it, and it broke with a sound like thunder. Rama and Sita were married, together with Rama’s three brothers."},e_boons:{t:"Kaikeyi’s two boons",tt:"కైకేయి వరాలు",src:"Ayodhya Kanda",book:tt,s:"King Dasharatha planned to crown Rama. Queen Kaikeyi, influenced by her maid Manthara, reminded the king of two boons he had once promised her. She asked that Bharata be crowned and that Rama live in the forest for fourteen years. To keep his father’s word, Rama accepted calmly, and Sita and Lakshmana went with him."},e_paduka:{t:"Rama’s sandals",tt:"రాముని పాదుకలు",src:"Ayodhya Kanda",book:tt,s:"Bharata was grieved when he learned what had happened, and went to the forest to bring Rama home. Rama would not break his father’s word. So Bharata took Rama’s pādukā (sandals), placed them on the throne, and ruled from Nandigrama as Rama’s servant until his return."},e_deer:{t:"The golden deer",tt:"బంగారు లేడి",src:"Aranya Kanda",book:tt,s:"Ravana asked the rakshasa Maricha to take the form of a beautiful golden deer. Sita wished to have it, and Rama followed it deep into the forest. While Rama and then Lakshmana were away, Ravana came disguised as a wandering ascetic and carried Sita away."},e_jatayu:{t:"Jatayu’s battle",tt:"జటాయువు పోరాటం",src:"Aranya Kanda",book:tt,s:"The old vulture king Jatayu, a friend of King Dasharatha, saw Ravana carrying Sita away and fought him bravely. Ravana cut his wings. Before he died, Jatayu told Rama that Ravana had taken Sita towards the south, and Rama performed his last rites like a son."},e_shabari:{t:"Shabari’s welcome",tt:"శబరి ఆతిథ్యం",src:"Aranya Kanda",book:tt,s:"Shabari, an elderly ascetic, had served her teachers and waited many years for Rama. When Rama and Lakshmana came to her hermitage, she welcomed them with forest fruits she had gathered, and then, blessed, left her body."},e_hanuman:{t:"Meeting Hanuman",tt:"హనుమంతుని కలయిక",src:"Kishkindha Kanda",book:tt,s:"Near Rishyamuka hill, Sugriva sent Hanuman to find out who the two brothers were. Hanuman spoke so well that Rama praised his speech. Hanuman brought Rama and Sugriva together, and they became friends with fire as their witness."},e_sampati:{t:"Sampati’s news",tt:"సంపాతి సమాచారం",src:"Kishkindha Kanda",book:tt,s:"Searching the south, the vanaras reached the ocean shore. There they met Sampati, Jatayu’s elder brother. With his sharp eyesight he saw Sita in Lanka, a hundred yojanas across the sea, and told them where she was."},e_leap:{t:"Hanuman’s leap and the ring",tt:"హనుమంతుని లంఘనం",src:"Sundara Kanda",book:tt,s:"Hanuman grew huge and leapt across the ocean to Lanka. He searched the city and found Sita in the Ashoka grove. He gave her Rama’s ring as a sign, and she gave him her hair jewel (chūḍāmaṇi) to take back to Rama."},e_setu:{t:"The bridge to Lanka",tt:"లంకకు సేతువు",src:"Yuddha Kanda",book:tt,s:"The ocean god told Rama that Nala, son of Vishwakarma, could build a bridge. The vanaras brought rocks and trees, and Nala built the setu across the sea in five days."},e_crown:{t:"Return to Ayodhya",tt:"అయోధ్యకు తిరుగు ప్రయాణం",src:"Yuddha Kanda",book:tt,s:"After fourteen years, Rama returned to Ayodhya in the Pushpaka vimana with Sita and Lakshmana. Bharata gladly gave back the kingdom, and Rama was crowned."},e_vyasa:{t:"Vyasa and the Mahabharata",tt:"వ్యాసుడు, మహాభారతం",src:"Adi Parva",book:at,s:"Sage Krishna Dvaipayana, known as Vyasa, composed the Mahabharata, the great story of the Kuru family. He taught it to his disciples, and his disciple Vaishampayana first recited it to King Janamejaya."},e_vow:{t:"Bhishma’s vow",tt:"భీష్మ ప్రతిజ్ఞ",src:"Adi Parva",book:at,s:"King Shantanu wished to marry Satyavati, but her father asked that her son be the next king. Prince Devavrata vowed never to claim the throne and never to marry. For this fearsome (bhīṣma) vow he was called Bhishma, and his father blessed him to choose the time of his own death."},e_eye:{t:"Drona’s test",tt:"ద్రోణుని పరీక్ష",src:"Adi Parva",book:at,s:"Drona placed a toy bird on a tree and asked each student what they saw. The others described the tree, the bird, their brothers and their teacher. Arjuna said he saw only the head of the bird, so Drona let him shoot. Popular retellings say “the bird’s eye”."},e_swayamvara:{t:"Draupadi’s swayamvara",tt:"ద్రౌపదీ స్వయంవరం",src:"Adi Parva",book:at,s:"King Drupada set a very hard test: string a mighty bow and hit a target high above, through an opening in a turning device. Many kings failed. Arjuna, disguised as a Brahmin, strung the bow and hit the target."},e_yaksha:{t:"The Yaksha’s questions",tt:"యక్ష ప్రశ్నలు",src:"Vana Parva",book:at,s:"Thirsty in the forest, four Pandavas drank from a lake without answering its guardian, and fell lifeless. Yudhishthira answered the Yaksha’s questions wisely. When asked what is faster than the wind, he said, “The mind.” Pleased, the Yaksha revealed himself as Dharma, Yudhishthira’s father, and brought the brothers back to life."},e_virata:{t:"The year in disguise",tt:"అజ్ఞాతవాసం",src:"Virata Parva",book:at,s:"In the thirteenth year of their exile, the Pandavas and Draupadi lived unrecognised in King Virata’s court. Yudhishthira became a courtier named Kanka, Bhima a cook named Vallabha, Arjuna a dance teacher named Brihannala, Nakula a horse-keeper and Sahadeva a cowherd."},e_peace:{t:"Krishna, messenger of peace",tt:"శ్రీకృష్ణ రాయబారం",src:"Udyoga Parva",book:at,s:"Krishna went to Hastinapura to ask for peace. He even said the Pandavas would accept just five villages. Duryodhana refused to give up even as much land as the point of a needle could hold."},e_gita:{t:"The Bhagavad Gita",tt:"భగవద్గీత",src:"Bhishma Parva",book:at,s:"As the war was about to begin, Arjuna saw teachers and relatives in both armies and put down his bow. Krishna, his charioteer, taught him about duty, action without selfish desire, and the true self. These 700 verses form the Bhagavad Gita."},e_chakra:{t:"Abhimanyu and the chakravyuha",tt:"అభిమన్యుడు, పద్మవ్యూహం",src:"Drona Parva",book:at,s:"Drona arranged his army in a wheel-shaped formation, the chakravyuha. Young Abhimanyu, son of Arjuna and Subhadra, knew how to break in but not how to come out. He entered it bravely and fought with great courage."},e_bed:{t:"Bhishma’s bed of arrows",tt:"అంపశయ్య",src:"Bhishma and Shanti Parvas",book:at,s:"Wounded by Arjuna’s arrows, Bhishma lay on a bed of arrows and waited for Uttarayana, the sun’s northward journey, to leave his body. The war lasted eighteen days. Afterwards Bhishma taught Yudhishthira about dharma, kingship and duty."}},ot={valmiki:["Valmiki","వాల్మీకి మహర్షి","The sage-poet who composed the Ramayana. He is called the Ādi Kavi, the first poet."],vyasa:["Vyasa","వ్యాస మహర్షి","Krishna Dvaipayana Vyasa, the sage who composed the Mahabharata. He is also the grandfather of the Pandavas and the Kauravas."],rama:["Rama","శ్రీరాముడు","Eldest son of King Dasharatha of Ayodhya, known for keeping his word and following dharma."],sita:["Sita","సీత","Daughter of King Janaka of Mithila and wife of Rama. Janaka found her in a furrow while ploughing."],lakshmana:["Lakshmana","లక్ష్మణుడు","Rama’s younger brother, who stayed by his side through all fourteen years in the forest."],bharata:["Bharata","భరతుడు","Son of Kaikeyi. He refused to take Rama’s throne and ruled only as Rama’s representative."],hanuman:["Hanuman","హనుమంతుడు","A vanara hero, son of Vayu (the wind) and Anjana, and Sugriva’s minister. He crossed the ocean to find Sita."],ravana:["Ravana","రావణుడు","The ten-headed king of Lanka, who carried Sita away."],jatayu:["Jatayu","జటాయువు","A great vulture king and friend of Dasharatha, who fought Ravana to save Sita."],sampati:["Sampati","సంపాతి","Jatayu’s elder brother. He saw Sita in Lanka and told the vanaras where she was."],nala:["Nala","నలుడు","A vanara builder, son of Vishwakarma, who built the setu (bridge) to Lanka."],vishwamitra:["Vishwamitra","విశ్వామిత్రుడు","A great sage who took young Rama and Lakshmana to protect his yajna and taught them divine weapons."],janaka:["Janaka","జనక మహారాజు","King of Mithila and Sita’s father, famous as a wise king."],kaikeyi:["Kaikeyi","కైకేయి","Queen of Dasharatha and mother of Bharata. Her two boons sent Rama to the forest."],shabari:["Shabari","శబరి","An elderly ascetic who waited many years to welcome Rama with forest fruits."],sugriva:["Sugriva","సుగ్రీవుడు","The vanara king of Kishkindha, who became Rama’s friend and ally."],maricha:["Maricha","మారీచుడు","A rakshasa who took the form of a golden deer to lead Rama away."],lavakusha:["Lava and Kusha","లవకుశులు","The twin sons of Rama and Sita, who were the first to sing the Ramayana."],arjuna:["Arjuna","అర్జునుడు","The third Pandava and a great archer. His bow is Gandiva, and Krishna was his charioteer."],krishna:["Krishna","శ్రీకృష్ణుడు","Arjuna’s friend and guide, who taught him the Bhagavad Gita on the battlefield."],yudhishthira:["Yudhishthira","యుధిష్ఠిరుడు","The eldest Pandava, famous for truthfulness. His father is Dharma."],bhishma:["Bhishma","భీష్ముడు","Born Devavrata, son of King Shantanu and Ganga. His lifelong vow earned him the name Bhishma."],drona:["Drona","ద్రోణాచార్యుడు","The teacher of archery to both the Pandavas and the Kauravas."],virata:["Virata","విరాటుడు","King of Matsya, in whose court the Pandavas lived in disguise for a year."],yaksha:["The Yaksha","యక్షుడు","The guardian of a lake who questioned Yudhishthira. He was Dharma in disguise."],subhadra:["Subhadra","సుభద్ర","Krishna’s sister, Arjuna’s wife and Abhimanyu’s mother."],abhimanyu:["Abhimanyu","అభిమన్యుడు","Son of Arjuna and Subhadra, a brave young warrior who entered the chakravyuha."]},st=[{en:"Valmiki’s Ramayana has about 24,000 ślokas (verses) in seven kāṇḍas.",src:"Ramayana, Bala Kanda"},{en:"The Mahabharata is traditionally said to have 100,000 ślokas, making it one of the longest poems ever composed.",src:"Mahabharata, Adi Parva"},{en:"Sītā means “furrow”. King Janaka found her in a furrow while ploughing a field.",src:"Ramayana, Bala Kanda"},{en:"Valmiki’s first verse begins “mā niṣāda” (“O hunter, do not…”), spoken in grief for a krauncha bird.",src:"Ramayana, Bala Kanda"},{en:"In Valmiki’s telling, Nala built the bridge to Lanka in five days.",src:"Ramayana, Yuddha Kanda"},{en:"Asked “What is faster than the wind?”, Yudhishthira answered: “The mind.”",src:"Mahabharata, Vana Parva"},{en:"Arjuna has ten names, including Savyasāchī (who shoots with either hand) and Dhanañjaya (winner of wealth).",src:"Mahabharata, Virata Parva"},{en:"Bhishma’s birth name was Devavrata. “Bhīṣma” means fearsome, after his vow.",src:"Mahabharata, Adi Parva"},{en:"The number 18 runs through the Mahabharata: 18 parvas, 18 days of war and 18 chapters of the Gita.",src:"Mahabharata"},{en:"“Itihāsa” comes from iti-ha-āsa: “so indeed it happened”.",src:"Sanskrit tradition"},{en:"In King Virata’s court, Arjuna lived as a dance teacher named Bṛhannalā.",src:"Mahabharata, Virata Parva"},{en:"Hanuman is called Māruti because he is the son of Vāyu, the wind (Maruta).",src:"Ramayana, Kishkindha Kanda"},{en:"The Ramayana was first sung in public by Rama’s twin sons, Lava and Kusha.",src:"Ramayana, Bala Kanda"},{en:"Krishna’s conch is Pāñchajanya and Arjuna’s is Devadatta. They blow them at the start of the Gita.",src:"Bhagavad Gita 1.15"},{en:"Jatayu’s elder brother Sampati could see Sita in Lanka from the far shore of the ocean.",src:"Ramayana, Kishkindha Kanda"},{en:"The Lakshmana Rekha and the squirrel who helped build the bridge a imple, calm versions of our games: big buttons, no timers and no losing. Made for children who need extra support, such as with ADHD, and for older adults with memory difficulties. For fun and focus skills practice, not a treatment.</p><div class="grid">${n.map(a).join("")}</div></section>\n  <section><div class="cat-h"><span class="dot" style="background:#8E82C4"></span><h2>In testing</h2><span>${i.length} games</span></div><p class="small" style="margin:-6px 0 10px">They earn XP and personal bests, but don’t count toward skill ratings yet. Your thumbs up or down decides if they join the main games.</p><div class="grid">${i.map(a).join("")}</div></section>\n  <section><div class="cat-h"><span class="dot" style="background:#8EDCC0"></span><h2>Coming soon</h2><span>${r.length} previews</span></div><p class="small" style="margin:-6px 0 10px">Try them early. Previews don’t earn XP. They’re here for your feedback: tap thumbs up or down after playing to vote them in.</p><div class="grid">${r.map(a).join("")}</div></section>\n  <p class="note" style="text-align:center;font-weight:800">Keep pocketing for more updates!</p>\n </div>`}const Wa=(e,t)=>`<a href="${e}" target="_blank" rel="noopener">${t}</a>`;function Ba(){e("#v-learn").innerHTML=da("Learn")+`<div class="vstack">\n <details class="box art" open><summary><span class="lbl">For parents and young players</span><h2>Growing focus and patience in a world of endless scrolling</h2></summary>\n  <p>Feeds and short videos are built to keep us switching: swipe, new clip, swipe again. Research is still growing, but studies link heavy short-video use with weaker sustained attention in young people. A 4-year study of 8,324 children found social media use was followed by more inattention symptoms. Video games and TV were not.</p>\n  <h3>Can games solve this problem?</h3>\n  <p>No study has tested whether games offset the effects of social media. Research found gaming was not linked to attention decline, and trials found that cutting social media time slightly improved wellbeing. Pocket Plays can be a way to swap some scrolling time for focused play.</p>\n  <h3>How Pocket Plays is designed to help</h3>\n  <ul><li>Every game has an end. There’s no endless feed to scroll.</li><li>No ads, no pop-ups, no chat, no account.</li><li>Patience games (Bloom, Breathe, Settle) reward waiting and calm.</li><li>Pause any time, and a gentle reminder suggests an eye break after 20 minutes.</li><li>The Scorecard shows your progress in games that practise focus, memory and self-control.</li></ul>\n  <h3>What helps most at home</h3>\n  <ul><li><b>Screen-free times:</b> meals, the hour before bed, and the first hour after waking.</li><li><b>Move and sleep:</b> studies link social media use with poorer sleep. Keep screens out of the hour before bed.</li><li><b>One thing at a time:</b> turn off notifications during homework and play.</li><li><b>Short sessions:</b> play one game at a time, for a set time you agree on.</li><li><b>Play together</b> and talk about what was hard and what got easier.</li><li><b>Parents’ phones too:</b> 46% of teens say a parent gets distracted by their phone while talking. Children notice what adults do.</li><li><b>Time outdoors:</b> each extra hour of daily screen time was linked to about 21% higher odds of short-sightedness.</li><li><b>Rest your eyes:</b> every 20 minutes, look at something far away for 20 seconds.</li><li><b>Make a family media plan</b> together, so everyone agrees on when and how screens are used.</li></ul>\n  <p class="small"><b>Young children:</b> the WHO recommends no screen time for babies under 1, and no more than 1 hour a day for children aged 2 to 4, with active play and good sleep being most important.</p>\n  <p class="small">Sources: ${Wa("https://www.who.int/publications/i/item/9789241550536","WHO guidelines for children under 5")} · ${Wa("https://publications.aap.org/pediatrics/article/154/6/e2024067417/199968/The-Family-Media-Plan","AAP: The Family Media Plan")} · ${Wa("https://pmc.ncbi.nlm.nih.gov/articles/PMC11236742/","Short video use and attention (EEG study)")} · ${Wa("https://www.tandfonline.com/doi/full/10.1080/02673843.2026.2623337","Short video use and thinking skills in youth: a review")} · ${Wa("https://news.ki.se/using-social-media-may-impair-childrens-attention","Social media and attention: 4-year study")} · ${Wa("https://pmc.ncbi.nlm.nih.gov/articles/PMC11939267/","Social media breaks: review of 20 trials")} · ${Wa("https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf","US Surgeon General advisory")} · ${Wa("https://www.pewresearch.org/internet/2024/03/11/how-teens-and-parents-approach-screen-time/","Pew: teens, parents and screen time")} · ${Wa("https://pubmed.ncbi.nlm.nih.gov/39982728/","Screen time and myopia")}</p>\n </details>\n <details class="box art"><summary><span class="lbl">Gamification for healthcare</span><h2>What research reports on games and health</h2></summary>\n  <p>Some games have been studied in clinical trials for specific conditions. Results are summarised below as reported by the studies.</p>\n  <ul>\n   <li><b>ADHD in children:</b> EndeavorRx was authorized by the US FDA in 2020 as a prescription device. In its main trial, scores on a computer attention test improved. Parent and clinician ratings of symptoms did not differ significantly. ${Wa("https://www.accessdata.fda.gov/cdrh_docs/reviews/DEN200026.pdf","FDA summary")}</li>\n   <li><b>Amblyopia (lazy eye):</b> Luminopia, which uses modified shows viewed in a headset, was FDA-cleared in 2021. In its trial, vision in the weaker eye improved more than with glasses alone. Ages 8 to 12 were added in 2025. ${Wa("https://www.healio.com/news/optometry/20250423/fda-clears-luminopia-for-amblyopia-in-children-aged-8-to-12-years-old","News")}</li>\n   <li><b>Teen depression:</b> in a randomised trial, SPARX, a game that teaches CBT skills, gave results similar to usual care. ${Wa("https://pubmed.ncbi.nlm.nih.gov/22773784/","Study")}</li>\n   <li><b>After a traumatic event:</b> early trials reported fewer intrusive memories in the first week after playing Tetris as part of a clinical protocol. A larger repeat study across six sites did not find this one-week effect. ${Wa("https://www.nature.com/articles/mp201723","Early study")} · ${Wa("https://online.ucpress.edu/collabra/article/11/1/130791/207825/Evidence-That-Tetris-Reduces-Immediate-but-Not","Repeat study")}</li>\n   <li><b>Older adults:</b> in a 20-year follow-up of one trial (2026), participants who did speed training with booster sessions had about 25% fewer dementia diagnoses. The memory and reasoning training groups showed no difference. ${Wa("https://www.hopkinsmedicine.org/news/newsroom/news-releases/2026/02/cognitive-speed-training-linked-to-lower-dementia-incidence-up-to-20-years-later","News")}</li>\n   <li><b>Stroke:</b> a review found game-based rehab improved arm function when added to usual therapy. It showed no difference when used instead of usual therapy. ${Wa("https://www.cochrane.org/evidence/CD008349_virtual-reality-stroke-rehabilitation","Review")}</li>\n   <li><b>Falls in older adults:</b> a review of trials found balance exercise games were associated with fewer falls. ${Wa("https://pmc.ncbi.nlm.nih.gov/articles/PMC13427072/","Review")}</li>\n   <li><b>Quitting smoking:</b> a review of trials found higher quit rates with gamified programmes. The difference was smaller at six months and later. ${Wa("https://pmc.ncbi.nlm.nih.gov/articles/PMC12199787/","Review")}</li>\n   <li><b>Needle procedures in children:</b> a review found game and VR distraction was associated with lower reported pain and fear. ${Wa("https://pmc.ncbi.nlm.nih.gov/articles/PMC11417701/","Review")}</li>\n  </ul>\n  <h3>Limits reported in research</h3>\n  <p>Reviews of general brain-training games report improvement mainly on the practised tasks and similar tasks, with limited evidence of effects on school results or
