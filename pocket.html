<body>
<div class="shell">
  <main class="view" id="v-play" aria-label="Play"></main>
  <main class="view" id="v-score" aria-label="Scorecard" hidden></main>
  <main class="view" id="v-rank" aria-label="Ranking" hidden></main>
  <main class="view" id="v-labs" aria-label="New games" hidden></main>
  <main class="view" id="v-learn" aria-label="Learn" hidden></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="17.5" cy="13.5" r="1" fill="currentColor"/></svg>Play</button>
    <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Scorecard</button>
    <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Ranking</button>
    <button data-tab="labs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>New</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>Learn</button>
    <button data-tab="cockpit" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M4 20h16"/></svg>Cockpit</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <form id="pform" autocomplete="off">
    <h3 id="sheetTitle">Welcome to Pocket Plays</h3>

    <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
    <div class="prow"><button type="button" class="btn" id="cancelP">Skip</button><button type="submit" class="btn pri" style="flex:1">Let's play</button></div>
  </form>
</div>

  </div>
  <div class="cvwrap"><canvas id="cv"></canvas><div id="panel" hidden></div></div>
</div>
