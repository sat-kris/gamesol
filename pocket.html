<body>
<div class="shell">
  <main class="view" id="v-play" aria-label="Play"></main>
  <main class="view" id="v-score" aria-label="Scorecard" hidden></main>
  <main class="view" id="v-rank" aria-label="Ranking" hidden></main>
  <main class="view" id="v-labs" aria-label="New games" hidden></main>
  <main class="view" id="v-learn" aria-label="Learn" hidden></main>
  <main class="view" id="v-cockpit" aria-label="Cockpit" hidden></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor"/><circle cx="17.5" cy="13.5" r="1" fill="currentColor"/></svg>Play</button>
    <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Scorecard</button>
    <button data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Ranking</button>
    <button data-tab="labs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>New</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>Learn</button>
    <button data-tab="cockpit" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M4 20h16"/></svg>Cockpit</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <form id="pform" autocomplete="off">
    <h3 id="sheetTitle">Welcome to Pocket Plays</h3>
    <div id="plist"></div>

    <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
    <div class="prow"><button type="button" class="btn" id="cancelP">Skip</button><button type="submit" class="btn pri" style="flex:1">Let's play</button></div>
  </form>
</div>

<div id="stage" hidden>

    <div id="stTitle"></div>
    <div id="hud"></div>

  </div>
  <div class="cvwrap"><canvas id="cv"></canvas><div id="panel" hidden></div></div>
</div>

e was followed by more inattention symptoms. Video games and TV were not.</p>\n  <h3>Can games solve this problem?</h3>\n  <p>No study has tested whether games offset the effects of social media. Research found gaming was not linked to attention decline, and trials found that cutting social media time slightly improved wellbeing. Pocket Plays can be a way to swap some scrolling time for focused play.</p>\n  <h3>How Pocket Plays is designed to help</h3>\n  <ul><li>Every game has an end. There’s no endless feed to scroll.</li><li>No ads, no pop-ups, no chat, no account.</li><li>Patience games (Bloom, Breathe, Settle) reward waiting and calm.</li><li>Pause any time, and a gentle reminder suggests an eye break after 20 minutes.</li><li>The Scorecard shows your progress in games that practise focus, memory and self-control.</li></ul>\n  <h3>What helps most at home</h3>\n  <ul><li><b>Screen-free times:</b> meals, the hour before bed, and the first hour after waking.</li><li><b>Move and sleep:</b> studies link social media use with poorer sleep. Keep screens out of the hour before bed.</li><li><b>One thing at a time:</b> turn off notifications during homework and play.</li><li><b>Short sessions:</b> play one game at a time, for a set time you agree on.</li><li><b>Play together</b> and talk about what was hard and what got easier.</li><li><b>Parents’ phones too:</b> 46% of teens say a parent gets distracted by their phone while talking. Children notice what adults do.</li><li><b>Time outdoors:</b> each extra hour of daily screen time was linked to about 21% higher odds of short-sightedness.</li><li><b>Rest your eyes:</b> every 20 minutes, look at something far away for 20 seconds.</li><li><b>Make a family media plan</b> together, so everyone agrees on when and how screens are used.</li></ul>\n  <p class="small"><b>Young children:</b> the WHO recommends no screen time for babies under 1, and no more than 1 hour a day for children aged 2 to 4, with active play and good sleep being most important.</p>\n  <p class="small">Sources: ${ga("https://www.who.int/publications/i/item/9789241550536","WHO guidelines for children under 5")} · ${ga("https://publications.aap.org/pediatrics/article/154/6/e2024067417/199968/The-Family-Media-Plan","AAP: The Family Media Plan")} · ${ga("https://pmc.ncbi.nlm.nih.gov/articles/PMC11236742/","Short video use and attention (EEG study)")} · ${ga("https://www.tandfonline.com/doi/full/10.1080/02673843.2026.2623337","Short video use and thinking skills in youth: a review")} · ${ga("https://news.ki.se/using-social-media-may-impair-childrens-attention","Social media and attention: 4-year study")} · ${ga("https://pmc.ncbi.nlm.nih.gov/articles/PMC11939267/","Social media breaks: review of 20 trials")} · ${ga("https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf","US Surgeon General advisory")} · ${ga("https://www.pewresearch.org/internet/2024/03/11/how-teens-and-parents-approach-screen-time/","Pew: teens, parents and screen time")} · ${ga("https://pubmed.ncbi.nlm.nih.gov/39982728/","Screen time and myopia")}</p>\n </details>\n <details class="box art"><summary><span class="lbl">Gamification for healthcare</span><h2>What research reports on games and health</h2></summary>\n  <p>Some games have been studied in clinical trials for specific conditions. Results are summarised below as reported by the studies.</p>\n  <ul>\n   <li><b>ADHD in children:</b> EndeavorRx was authorized by the US FDA in 2020 as a prescription device. In its main trial, scores on a computer attention test improved. Parent and clinician ratings of symptoms did not differ significantly. ${ga("https://www.accessdata.fda.gov/cdrh_docs/reviews/DEN200026.pdf","FDA summary")}</li>\n   <li><b>Amblyopia (lazy eye):</b> Luminopia, which uses modified shows viewed in a headset, was FDA-cleared in 2021. In its trial, vision in the weaker eye improved more than with glasses alone. Ages 8 to 12 were added in 2025. ${ga("https://www.healio.com/news/optometry/20250423/fda-clears-luminopia-for-amblyopia-in-children-aged-8-to-12-years-old","News")}</li>\n   <li><b>Teen depression:</b> in a randomised trial, SPARX, a game that teaches CBT skills, gave results similar to usual care. ${ga("https://pubmed.ncbi.nlm.nih.gov/22773784/","Study")}</li>\n   <li><b>After a traumatic event:</b> early trials reported fewer intrusive memories in the first week after playing Tetris as part of a clinical protocol. A larger repeat study across six sites did not find this one-week effect. ${ga("https://www.nature.com/articles/mp201723","Early study")} · ${ga("https://online.ucpress.edu/collabra/article/11/1/130791/207825/Evidence-That-Tetris-Reduces-Immediate-but-Not","Repeat study")}</li>\n   <li><b>Older adults:</b> in a 20-year follow-up of one trial (2026), participants who did speed training with booster sessions had about 25% fewer dementia diagnoses. The memory and reasoning training groups showed no difference. ${ga("https://www.hopkinsmedicine.org/news/newsroom/news-releases/2026/02/cognitive-speed-training-linked-to-lower-dementia-incidence-up-to-20-years-later","News")}</li>\n   <li><b>Stroke:</b> a review found game-based rehab improved arm function when added to usual therapy. It showed no difference when used instead of usual therapy. ${ga("https://www.cochrane.org/evidence/CD008349_virtual-reality-stroke-rehabilitation","Review")}</li>\n   <li><b>Falls in older adults:</b> a review of trials found balance exercise games were associated with fewer falls. ${ga("https://pmc.ncbi.nlm.nih.gov/articles/PMC13427072/","Review")}</li>\n   <li><b>Quitting smoking:</b> a review of trials found higher quit rates with gamified programmes. The difference was smaller at six months and later. ${ga("https://pmc.ncbi.nlm.nih.gov/articles/PMC12199787/","Review")}</li>\n   <li><b>Needle procedures in children:</b> a review found game and VR distraction was associated with lower reported pain and fear. ${ga("https://pmc.ncbi.nlm.nih.gov/articles/PMC11417701/","Review")}</li>\n  </ul>\n  <h3>Limits reported in research</h3>\n  <p>Reviews of general brain-training games report improvement mainly on the practised tasks and similar tasks, with limited evidence of effects on school results or IQ. ${ga("https://longevity.stanford.edu/1032016-do-brain-training-programs-work","Expert review")}</p>\n  <h3>About Pocket Plays</h3>\n  <p>Pocket Plays is for fun and focus skills practice. It has not been studied in clinical trials and is not a medical product. For health concerns, please consult a doctor.</p>\n </details>\n <p class="note" style="text-align:center;font-weight:800">Keep pocketing for more updates!</p>\n</div>`}function ba(){({play:Zt,score:ca,rank:da,labs:ma,learn:wa,cockpit:fa})[Kt]()}document.addEventListener("click",t=>{if(!e("#stage").hidden)return;const a=t.target.closest("[data-game]");if(a)return F()?void Qa(a.dataset.game):void va(!1,a.dataset.game);const o=t.target.closest("[data-act]");o&&va("switch"===o.dataset.act)});let xa=null;function va(a,o){xa=o||null;const n=Object.values(C.players);e("#sheetTitle").textContent=n.length&&a?"Switch player":n.length?"Add a player":"Welcome to Pocket Plays",e("#cancelP").textContent=n.length?"Cancel":"Skip",e("#plist").innerHTML=n.length&&a?n.map(e=>`<div class="prow2" data-row="${e.id}"><button type="button" class="pick" data-pick="${e.id}">${vt(e)}<span style="flex:1;font-weight:800">${t(e.nick)}${e.id===C.cur?' <span class="small">(playing now)</span>':""}</span><span class="small">${e.xp} XP</span></button><button type="button" class="delb" data-del="${e.id}" aria-label="Remove ${t(e.nick)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button></div>`).join("")+'<p class="lbl" style="margin:12px 0 0">Or add someone new</p>':"",document.querySelectorAll("[data-pick]").forEach
