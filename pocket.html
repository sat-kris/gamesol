 and USA","Physics","The theory of relativity and E = mc²",["My most famous equation is E = mc².","I won the Nobel Prize for explaining the photoelectric effect.","I showed that time can pass at different speeds."],0],archimedes:["Archimedes","🛁","c. 287–212 BCE","Syracuse (Greek world)","Maths and engineering","Explaining floating (buoyancy) and levers",["I lived in Syracuse over 2,000 years ago.","I am said to have shouted “Eureka!” in my bath.","I explained why things float."],1],curie:["Marie Curie","☢️","1867–1934","Poland and France","Physics and chemistry","Radioactivity, and discovering polonium and radium",["I was born in Poland and worked in Paris.","I discovered two new elements, polonium and radium.","I was the first person to win two Nobel Prizes."],1],darwin:["Charles Darwin","🐢","1809–1882","England","Biology","Evolution by natural selection",["I sailed around the world on a ship called the Beagle.","I studied finches and tortoises on the Galápagos Islands.","I explained how living things change over many generations."],1],galileo:["Galileo Galilei","🔭","1564–1642","Italy","Astronomy and physics","Telescope discoveries, like the four large moons of Jupiter",["I pointed a telescope at the night sky in 1609–1610.","I discovered four large moons of Jupiter.","I argued that the Earth goes around the Sun."],1],pasteur:["Louis Pasteur","🥛","1822–1895","France","Microbiology","Pasteurisation and the rabies vaccine",["I showed that germs make food and drinks go bad.","A way of heating milk to make it safe is named after me.","I made a vaccine against rabies."],1],fleming:["Alexander Fleming","🧫","1881–1955","Scotland","Medicine","Discovering penicillin",["I noticed a mould killing bacteria on a dish.","I discovered penicillin in 1928.","My discovery led to the first antibiotic medicines."],1],raman:["C. V. Raman","🌈","1888–1970","India","Physics","The Raman effect: how light scatters",["I studied how light scatters when it passes through things.","The effect I found carries my name.","In 1930 I became the first Asian to win a Nobel Prize in science."],1],salim:["Salim Ali","🐦","1896–1987","India","Ornithology","Studying and protecting India’s birds",["I am known as the Birdman of India.","I wrote “The Book of Indian Birds”.","As a boy, a yellow-throated sparrow made me curious about birds."],1],goodall:["Jane Goodall","🦍","1934–2025","England","Animal behaviour","Studying wild chimpanzees",["I studied wild chimpanzees in Gombe, Tanzania.","I saw chimpanzees make and use tools.","I started a youth programme called Roots & Shoots."],1],aryabhata:["Aryabhata","🌍","476–550 CE","India","Astronomy and maths","Early astronomy, including that the Earth spins",["I wrote the Aryabhatiya in 499 CE.","I said the Earth spins on its axis.","India’s first satellite was named after me."],2],ramanujan:["Srinivasa Ramanujan","♾️","1887–1920","India","Mathematics","Brilliant discoveries about numbers and infinite series",["I learned much of my mathematics on my own.","I went to Cambridge to work with G. H. Hardy.","1729 is called the Hardy–Ramanujan number."],2],sarabhai:["Vikram Sarabhai","🛰️","1919–1971","India","Space science","Founding India’s space programme",["I am called the father of the Indian space programme.","I helped set up ISRO.","The Chandrayaan-3 lander was named Vikram after me."],2],jcbose:["Jagadish Chandra Bose","🌱","1858–1937","India","Physics and plant science","Early radio-wave work and the crescograph",["I built a crescograph to measure how plants grow.","I showed that plants respond to the world around them.","I did early work on radio waves in Kolkata."],2],mendel:["Gregor Mendel","🫛","1822–1884","Austrian Empire (now Czechia)","Biology","The rules of heredity, found with pea plants",["I was a monk who grew thousands of pea plants.","I found rules for how traits pass from parents to children.","I am called the father of genetics."],2],mendeleev:["Dmitri Mendeleev","🧪","1834–1907","Russia","Chemistry","The periodic table of elements",["I arranged the elements in a table.","I left gaps for elements nobody had found yet.","Element 101, mendelevium, is named after me."],2],faraday:["Michael Faraday","🧲","1791–1867","England","Physics and chemistry","Making electricity from magnetism",["I left school early and trained as a bookbinder.","I showed that a moving magnet can make electricity.","The unit of capacitance, the farad, is named after me."],2],tesla:["Nikola Tesla","⚡","1856–1943","Born in today’s Croatia, worked in the USA","Electrical engineering","Alternating current (AC) motors and power",["I was born in what is now Croatia.","I developed the alternating current (AC) motor.","A unit of magnetic field strength is named after me."],2],hawking:["Stephen Hawking","🌌","1942–2018","England","Physics","Showing black holes can give off radiation",["I wrote “A Brief History of Time”.","I showed black holes can slowly give off radiation.","I spoke using a computer voice."],2],jenner:["Edward Jenner","💉","1749–1823","England","Medicine","The first vaccine, against smallpox",["I was a country doctor in England.","I used cowpox to protect people from smallpox.","The word “vaccine” comes from the Latin word for cow."],2],lovelace:["Ada Lovelace","💻","1815–1852","England","Mathematics","The first published computer program",["My father was the poet Lord Byron.","I wrote notes on Charles Babbage’s Analytical Engine.","I am often called the first computer programmer."],2],hubble:["Edwin Hubble","🔭","1889–1953","USA","Astronomy","Showing that the universe is expanding",["I showed there are galaxies beyond our Milky Way.","I found that distant galaxies are moving away from us.","A famous space telescope carries my name."],2],bernerslee:["Tim Berners-Lee","🌐","born 1955","England","Computer science","Inventing the World Wide Web",["I worked at CERN in Switzerland.","In 1989 I proposed the World Wide Web.","I made the web free for everyone to use."],2],snbose:["Satyendra Nath Bose","⚛️","1894–1974","India","Physics","Bose–Einstein statistics; bosons are named after him",["I sent my ideas about light particles to Einstein.","A whole family of particles, bosons, is named after me.","I taught physics in Dhaka and Kolkata."],3],chandra:["Subrahmanyan Chandrasekhar","⭐","1910–1995","India and USA","Astrophysics","The Chandrasekhar limit for white dwarf stars",["I worked out how heavy a white dwarf star can be.","That limit, about 1.4 times the Sun’s mass, carries my name.","NASA’s Chandra X-ray telescope is named after me."],3],bhabha:["Homi J. Bhabha","🔬","1909–1966","India","Nuclear physics","Leading India’s atomic energy programme",["I founded the Tata Institute of Fundamental Research.","I led India’s atomic energy programme.","A research centre in Trombay, Mumbai, is named after me."],3],sushruta:["Sushruta","🩺","Ancient India","India","Medicine and surgery","The Sushruta Samhita, an ancient text on surgery",["I lived in ancient India, in the region of Kashi.","My text describes many surgeries, including repairing noses.","I am often called the father of surgery."],3],janaki:["E. K. Janaki Ammal","🌾","1897–1984","India","Botany","Plant breeding, including sweeter sugarcane",["I was a botanist from Kerala.","I helped breed sweeter sugarcane varieties for India.","I studied the chromosomes of many plants."],3],copernicus:["Nicolaus Copernicus","☀️","1473–1543","Poland","Astronomy","The Sun-centred model of the solar system",["I said the Sun, not the Earth, is at the centre.","My great book was published in the year I died, 1543.","I was also trained as a doctor."],3],kepler:["Johannes Kepler","🪐","1571–1630","Germany","Astronomy","The laws of planetary motion",["I showed planets move in ellipses, not perfect circles.","I wrote three laws of planetary motion.","A NASA planet-hunting telescope was named after me."],3],franklin:["Rosalind Franklin","🧬","1920–1958","England","Chemistry","X-ray images that revealed DNA’s double helix",["I took X-ray pictures of DNA.","My “Photo 51” helped show DNA is a double helix.","I also studied viruses and coal."],3],turing:["Alan Turing","🖥️","1912–1954","England","Mathematics and computing","The foundations of computer science",["I helped break secret codes in World War II.","I imagined a simple machine that could carry out any calculation.","A famous test of machine intelligence is named after me."],3],bohr:["Niels Bohr","⚛️","1885–1962","Denmark","Physics","A model of the atom with energy levels",["I said electrons sit in fixed energy levels.","I won the 1922 Nobel Prize in Physics.","Element 107, bohrium, is named after me."],3],rutherford:["Ernest Rutherford","🎯","1871–1937","New Zealand","Physics","Discovering the atomic nucleus",["I was born in New Zealand.","My team fired alpha particles at thin gold foil.","I discovered that atoms have a tiny, dense nucleus."],3],leeuwenhoek:["Antonie van Leeuwenhoek","🔍","1632–1723","Netherlands","Microscopy","First to see bacteria through a microscope",["I was a cloth merchant who made tiny lenses.","I was the first to see bacteria.","I called the tiny creatures “animalcules”."],3],katherine:["Katherine Johnson","🧮","1918–2020","USA","Mathematics","Calculating flight paths for NASA",["I was a NASA mathematician.","John Glenn asked me to check the computer’s numbers before his orbit.","The film “Hidden Figures” tells part of my story."],3],carson:["Rachel Carson","🌿","1907–1964","USA","Marine biology","“Silent Spring” and the environmental movement",["I was a marine biologist.","My book “Silent Spring” warned about pesticides like DDT.","My work helped start the modern environmental movement."],3],khorana:["Har Gobind Khorana","🧬","1922–2011","India and USA","Biochemistry","Helping crack the genetic code",["I was born in a village in Punjab.","I helped show how DNA’s code is read to make proteins.","I shared the 1968 Nobel Prize in Medicine."],4],venki:["Venkatraman Ramakrishnan","🧫","born 1952","India and UK","Structural biology","The  three brothers."},e_boons:{t:"Kaikeyi’s two boons",tt:"కైకేయి వరాలు",src:"Ayodhya Kanda",book:Ae,s:"King Dasharatha planned to crown Rama. Queen Kaikeyi, influenced by her maid Manthara, reminded the king of two boons he had once promised her. She asked that Bharata be crowned and that Rama live in the forest for fourteen years. To keep his father’s word, Rama accepted calmly, and Sita and Lakshmana went with him."},e_paduka:{t:"Rama’s sandals",tt:"రాముని పాదుకలు",src:"Ayodhya Kanda",book:Ae,s:"Bharata was grieved when he learned what had happened, and went to the forest to bring Rama home. Rama would not break his father’s word. So Bharata took Rama’s pādukā (sandals), placed them on the throne, and ruled from Nandigrama as Rama’s servant until his return."},e_deer:{t:"The golden deer",tt:"బంగారు లేడి",src:"Aranya Kanda",book:Ae,s:"Ravana asked the rakshasa Maricha to take the form of a beautiful golden deer. Sita wished to have it, and Rama followed it deep into the forest. While Rama and then Lakshmana were away, Ravana came disguised as a wandering ascetic and carried Sita away."},e_jatayu:{t:"Jatayu’s battle",tt:"జటాయువు పోరాటం",src:"Aranya Kanda",book:Ae,s:"The old vulture king Jatayu, a friend of King Dasharatha, saw Ravana carrying Sita away and fought him bravely. Ravana cut his wings. Before he died, Jatayu told Rama that Ravana had taken Sita towards the south, and Rama performed his last rites like a son."},e_shabari:{t:"Shabari’s welcome",tt:"శబరి ఆతిథ్యం",src:"Aranya Kanda",book:Ae,s:"Shabari, an elderly ascetic, had served her teachers and waited many years for Rama. When Rama and Lakshmana came to her hermitage, she welcomed them with forest fruits she had gathered, and then, blessed, left her body."},e_hanuman:{t:"Meeting Hanuman",tt:"హనుమంతుని కలయిక",src:"Kishkindha Kanda",book:Ae,s:"Near Rishyamuka hill, Sugriva sent Hanuman to find out who the two brothers were. Hanuman spoke so well that Rama praised his speech. Hanuman brought Rama and Sugriva together, and they became friends with fire as their witness."},e_sampati:{t:"Sampati’s news",tt:"సంపాతి సమాచారం",src:"Kishkindha Kanda",book:Ae,s:"Searching the south, the vanaras reached the ocean shore. There they met Sampati, Jatayu’s elder brother. With his sharp eyesight he saw Sita in Lanka, a hundred yojanas across the sea, and told them where she was."},e_leap:{t:"Hanuman’s leap and the ring",tt:"హనుమంతుని లంఘనం",src:"Sundara Kanda",book:Ae,s:"Hanuman grew huge and leapt across the ocean to Lanka. He searched the city and found Sita in the Ashoka grove. He gave her Rama’s ring as a sign, and she gave him her hair jewel (chūḍāmaṇi) to take back to Rama."},e_setu:{t:"The bridge to Lanka",tt:"లంకకు సేతువు",src:"Yuddha Kanda",book:Ae,s:"The ocean god told Rama that Nala, son of Vishwakarma, could build a bridge. The vanaras brought rocks and trees, and Nala built the setu across the sea in five days."},e_crown:{t:"Return to Ayodhya",tt:"అయోధ్యకు తిరుగు ప్రయాణం",src:"Yuddha Kanda",book:Ae,s:"After fourteen years, Rama returned to Ayodhya in the Pushpaka vimana with Sita and Lakshmana. Bharata gladly gave back the kingdom, and Rama was crowned."},e_vyasa:{t:"Vyasa and the Mahabharata",tt:"వ్యాసుడు, మహాభారతం",src:"Adi Parva",book:Te,s:"Sage Krishna Dvaipayana, known as Vyasa, composed the Mahabharata, the great story of the Kuru family. He taught it to his disciples, and his disciple Vaishampayana first recited it to King Janamejaya."},e_vow:{t:"Bhishma’s vow",tt:"భీష్మ ప్రతిజ్ఞ",src:"Adi Parva",book:Te,s:"King Shantanu wished to marry Satyavati, but her father asked that her son be the next king. Prince Devavrata vowed never to claim the throne and never to marry. For this fearsome (bhīṣma) vow he was called Bhishma, and his father blessed him to choose the time of his own death."},e_eye:{t:"Drona’s test",tt:"ద్రోణుని పరీక్ష",src:"Adi Parva",book:Te,s:"Drona placed a toy bird on a tree and asked each student what they saw. The others described the tree, the bird, their brothers and their teacher. Arjuna said he saw only the head of the bird, so Drona let him shoot. Popular retellings say “the bird’s eye”."},e_swayamvara:{t:"Draupadi’s swayamvara",tt:"ద్రౌపదీ స్వయంవరం",src:"Adi Parva",book:Te,s:"King Drupada set a very hard test: string a mighty bow and hit a target high above, through an opening in a turning device. Many kings failed. Arjuna, disguised as a Brahmin, strung the bow and hit the target."},e_yaksha:{t:"The Yaksha’s questions",tt:"యక్ష ప్రశ్నలు",src:"Vana Parva",book:Te,s:"Thirsty in the forest, four Pandavas drank from a lake without answering its guardian, and fell lifeless. Yudhishthira answered the Yaksha’s questions wisely. When asked what is faster than the wind, he said, “The mind.” Pleased, the Yaksha revealed himself as Dharma, Yudhishthira’s father, and brought the brothers back to life."},e_virata:{t:"The year in disguise",tt:"అజ్ఞాతవాసం",src:"Virata Parva",book:Te,s:"In the thirteenth year of their exile, the Pandavas and Draupadi lived unrecognised in King Virata’s court. Yudhishthira became a courtier named Kanka, Bhima a cook named Vallabha, Arjuna a dance teacher named Brihannala, Nakula a horse-keeper and Sahadeva a cowherd."},e_peace:{t:"Krishna, messenger of peace",tt:"శ్రీకృష్ణ రాయబారం",src:"Udyoga Parva",book:Te,s:"Krishna went to Hastinapura to ask for peace. He even said the Pandavas would accept just five villages. Duryodhana refused to give up even as much land as the point of a needle could hold."},e_gita:{t:"The Bhagavad Gita",tt:"భగవద్గీత",src:"Bhishma Parva",book:Te,s:"As the war was about to begin, Arjuna saw teachers and relatives in both armies and put down his bow. Krishna, his charioteer, taught him about duty, action without selfish desire, and the true self. These 700 verses form the Bhagavad Gita."},e_chakra:{t:"Abhimanyu and the chakravyuha",tt:"అభిమన్యుడు, పద్మవ్యూహం",src:"Drona Parva",book:Te,s:"Drona arranged his army in a wheel-shaped formation, the chakravyuha. Young Abhimanyu, son of Arjuna and Subhadra, knew how to break in but not how to come out. He entered it bravely and fought with great courage."},e_bed:{t:"Bhishma’s bed of arrows",tt:"అంపశయ్య",src:"Bhishma and Shanti Parvas",book:Te,s:"Wounded by Arjuna’s arrows, Bhishma lay on a bed of arrows and waited for Uttarayana, the sun’s northward journey, to leave his body. The war lasted eighteen days. Afterwards Bhishma taught Yudhishthira about dharma, kingship and duty."}},We={valmiki:["Valmiki","వాల్మీకి మహర్షి","The sage-poet who composed the Ramayana. He is called the Ādi Kavi, the first poet."],vyasa:["Vyasa","వ్యాస మహర్షి","Krishna Dvaipayana Vyasa, the sage who composed the Mahabharata. He is also the grandfather of the Pandavas and the Kauravas."],rama:["Rama","శ్రీరాముడు","Eldest son of King Dasharatha of Ayodhya, known for keeping his word and following dharma."],sita:["Sita","సీత","Daughter of King Janaka of Mithila and wife of Rama. Janaka found her in a furrow while ploughing."],lakshmana:["Lakshmana","లక్ష్మణుడు","Rama’s younger brother, who stayed by his side through all fourteen years in the forest."],bharata:["Bharata","భరతుడు","Son of Kaikeyi. He refused to take Rama’s throne and ruled only as Rama’s representative."],hanuman:["Hanuman","హనుమంతుడు","A vanara hero, son of Vayu (the wind) and Anjana, and Sugriva’s minister. He crossed the ocean to find Sita."],ravana:["Ravana","రావణుడు","The ten-headed king of Lanka, who carried Sita away."],jatayu:["Jatayu","జటాయువు","A great vulture king and friend of Dasharatha, who fought Ravana to save Sita."],sampati:["Sampati","సంపాతి","Jatayu’s elder brother. He saw Sita in Lanka and told the vanaras where she was."],nala:["Nala","నలుడు","A vanara builder, son of Vishwakarma, who built the setu (bridge) to Lanka."],vishwamitra:["Vishwamitra","విశ్వామిత్రుడు","A great sage who took young Rama and Lakshmana to protect his yajna and taught them divine weapons."],janaka:["Janaka","జనక మహారాజు","King of Mithila and Sita’s father, famous as a wise king."],kaikeyi:["Kaikeyi","కైకేయి","Queen of Dasharatha and mother of Bharata. Her two boons sent Rama to the forest."],shabari:["Shabari","శబరి","An elderly ascetic who waited many years to welcome Rama with forest fruits."],sugriva:["Sugriva","సుగ్రీవుడు","The vanara king of Kishkindha, who became Rama’s friend and ally."],maricha:["Maricha","మారీచుడు","A rakshasa who took the form of a golden deer to lead Rama away."],lavakusha:["Lava and Kusha","లవకుశులు","The twin sons of Rama and Sita, who were the first to sing the Ramayana."],arjuna:["Arjuna","అర్జునుడు","The third Pandava and a great archer. His bow is Gandiva, and Krishna was his charioteer."],krishna:["Krishna","శ్రీకృష్ణుడు","Arjuna’s friend and guide, who taught him the Bhagavad Gita on the battlefield."],yudhishthira:["Yudhishthira","యుధిష్ఠిరుడు","The eldest Pandava, famous for truthfulness. His father is Dharma."],bhishma:["Bhishma","భీష్ముడు","Born Devavrata, son of King Shantanu and Ganga. His lifelong vow earned him the name Bhishma."],drona:["Drona","ద్రోణాచార్యుడు","The teacher of archery to both the Pandavas and the Kauravas."],virata:["Virata","విరాటుడు","King of Matsya, in whose court the Pandavas lived in disguise for a year."],yaksha:["The Yaksha","యక్షుడు","The guardian of a lake who questioned Yudhishthira. He was Dharma in disguise."],subhadra:["Subhadra","సుభద్ర","Krishna’s sister, Arjuna’s wife and Abhimanyu’s mother."],abhimanyu:["Abhimanyu","అభిమన్యుడు","Son of Arjuna and Subhadra, a brave young warrior who entered the chakravyuha."]},Pe=[{en:"Valmiki’s Ramayana has about 24,000 ślokas (verses) in seven kāṇḍas.",src:"Ramayana, Bala Kanda"},{en:"The Mahabharata is traditionally said to have 100,000 ślokas, making it one of the longest poems ever composed.",src:"Mahabharata, Adi Parva"},{en:"Sītā means “furrow”. King Janaka found her in a furrow while ploughing a field.",src:"Ramayana, Bala Kanda"},{en:"Valmiki’s first verse begins “mā niṣāda” (“O hunter, do not…”), spoken in grief for a krauncha bird.",src:"Ramayana, Bala Kanda"},{en:"In Valmiki’s telling, Nala built the bridge to Lanka in five days.",src:"Ramayana, Yuddha Kanda"},{en:"Asked “What is faster than the wind?”, Yudhishthira answered: “The mind.”",src:"Mahabharata, Vana Parva"},{en:"Arjuna has ten names, including Savyasāchī (who shoots with either hand) and Dhanañjaya (winner of wealth).",src:"Mahabharata, Virata Parva"},{en:"Bhishma’s birth name was Devavrata. “Bhīṣma” means fearsome, after his vow.",src:"Mahabharata, Adi Parva"},{en:"The number 18 runs through the Mahabharata: 18 parvas, 18 days of war and 18 chapters of the Gita.",src:"Mahabharata"},{en:"“Itihāsa” comes from iti-ha-āsa: “so indeed it happened”.",src:"Sanskrit tradition"},{en:"In King Virata’s court, Arjuna lived as a dance teacher named Bṛhannalā.",src:"Mahabharata, Virata Parva"},{en:"Hanuman is called Māruti because he is the son of Vāyu, the wind (Maruta).",src:"Ramayana, Kishkindha Kanda"},{en:"The Ramayana was first sung in public by Rama’s twin sons, Lava and Kusha.",src:"Ramayana, Bala Kanda"},{en:"Krishna’s conch is Pāñchajanya and Arjuna’s is Devadatta. They blow them at the start of the Gita.",src:"Bhagavad Gita 1.15"},{en:"Jatayu’s elder brother Sampati could see Sita in Lanka from the far shore of the ocean.",src:"Ramayana, Kishkindha Kanda"},{en:"The Lakshmana Rekha and the squirrel who helped build the bridge are loved stories, but they are not in Valmiki’s text. They come from later retellings.",src:"Valmiki’s Ramayana"}],Re=(a,e,t,n,s,o,i,r)=>({q:a,qt:e,a:t,at:n,w:s,img:o,ep:i,ch:r}),Ce={bala:[Re("Who wrote the Ramayana?","రామాయణాన్ని ఎవరు రచించారు?","Maharshi Valmiki","వాల్మీకి మహర్షి",[["Vyasa","వ్యాసుడు"],["Kalidasa","కాళిదాసు"],["Tulsidas","తులసీదాసు"]],"📜","e_krauncha",["valmiki"]),Re("Who composed the Mahabharata?","మహాభారతాన్ని ఎవరు రచించారు?","Maharshi Vyasa","వ్యాస మహర్షి",[["Valmiki","వాల్మీకి"],["Kalidasa","కాళిదాసు"],["Pothana","పోతన"]],"📜","e_vyasa",["vyasa"])  the Pandavas?","పాండవుల తరఫున శ్రీకృష్ణుడు ఎన్ని గ్రామాలు అడిగాడు?","5","5",[["1","1"],["10","10"],["100","100"]],"🕊️","e_peace",["krishna"])]},Be={bala:["Maharshi Valmiki composed the Ramayana. Moved by the cry of a krauncha bird, he spoke the first śloka, and Brahma asked him to tell Rama’s story in that metre. That is why he is called the Ādi Kavi, the first poet.","Maharshi Vyasa, also called Krishna Dvaipayana, composed the Mahabharata. He also arranged the Vedas into four, which is why he is called Veda Vyasa.","King Janaka kept the great bow of Lord Shiva. Rama lifted it, strung it, and it broke with a sound like thunder. This won him Sita’s hand.","Bharata would not take the throne that was meant for Rama. He placed Rama’s pādukā (sandals) on it and ruled as Rama’s servant until Rama came home.","Kaikeyi’s second boon asked that Rama live in the forest for fourteen years. Rama accepted calmly to keep his father’s word.","Rama gave Hanuman his ring, marked with his name, so that Sita would trust him. Hanuman gave it to her in the Ashoka grove in Lanka.","Nala, a vanara skilled in building, led the vanaras in building the setu across the ocean to Lanka.","Jatayu, the old vulture king, fought Ravana to stop him carrying Sita away. Though badly wounded, he lived long enough to tell Rama which way Ravana had gone.","Lakshmana would not stay behind. He left Ayodhya with Rama and Sita and served them through all fourteen years in the forest.","The rakshasa Maricha became a beautiful golden deer to lure Rama away, so that Ravana could carry off Sita.","Shabari, an elderly ascetic, had waited many years for Rama. When he came to her hermitage, she welcomed him with forest fruits she had gathered.","Ravana ruled the golden city of Lanka, across the southern ocean. Hanuman leapt over the sea to reach it.","There were five Pandava brothers: Yudhishthira, Bhima, Arjuna, Nakula and Sahadeva, the sons of King Pandu.","Drona asked each student what they could see. The others saw the tree, the bird and their teacher. Arjuna said he saw only the bird’s head, so Drona let him shoot, and he hit it.","Yudhishthira, son of Kunti, was the eldest Pandava. He was known for always following dharma and speaking the truth.","Gāṇḍīva was a divine bow. Varuna gave it to Arjuna at Agni’s request, before the burning of the Khandava forest.","Krishna chose not to fight in the war, but agreed to drive Arjuna’s chariot. On that chariot he taught Arjuna the Bhagavad Gita.","Ayodhya, on the Sarayu river, was the capital of Kosala, ruled by King Dasharatha. Rama returned there after fourteen years to be crowned.","King Janaka of Mithila found baby Sita in a furrow while ploughing a field, and raised her as his own daughter.","Setu means bridge. The vanaras built a setu across the ocean so Rama’s army could reach Lanka.","Hanuman is the son of Vāyu, the wind god, and Anjana. That is why he is also called Māruti and Pavanaputra."],praudha:["Ādi means first and kāvya means poem. The Ramayana is honoured as the first poem, and Valmiki as the Ādi Kavi, the first poet.","A hunter shot one of a pair of krauncha birds. The cry of its mate filled Valmiki with grief (śoka), and his words came out in a perfect metre: the first śloka.","Sage Vishwamitra asked King Dasharatha to send Rama to guard his yajna from rakshasas like Maricha and Subahu. Lakshmana went with them.","The seven kāṇḍas are Bala, Ayodhya, Aranya, Kishkindha, Sundara, Yuddha and Uttara.","The Sundara Kāṇḍa tells of Hanuman’s leap across the ocean, his search through Lanka and his meeting with Sita in the Ashoka grove.","Sampati, Jatayu’s elder brother, had lost his wings long ago flying too near the sun. From his high perch he told the vanaras that Sita was in Lanka.","Māruti means son of Maruta, another name for Vāyu, the wind god. Hanuman is Vāyu’s son.","Long ago Kaikeyi had saved Dasharatha in battle, and he promised her two boons. She used them to ask that Bharata be crowned and that Rama live in the forest for fourteen years.","Nala was the son of Vishwakarma, the divine architect, and shared his father’s skill in building.","Sītā means a furrow. King Janaka found her in the earth while ploughing a field for a yajna.","The Mahabharata is arranged in 18 parvas (books), from the Adi Parva to the Svargarohana Parva.","Bhishma was born Devavrata, son of King Shantanu and Ganga. He was called Bhishma, “of the terrible vow”, after he vowed never to marry or take the throne.","A Yaksha guarding a lake stopped the Pandavas from drinking. Only Yudhishthira answered his questions wisely. The Yaksha was really Dharma, Yudhishthira’s father.","Among the Yaksha’s many questions was “What is faster than the wind?” Yudhishthira replied: “The mind.”","In the thirteenth year of exile the Pandavas had to live unrecognised. They stayed in disguise at the court of King Virata of Matsya.","Because of Urvashi’s curse, Arjuna spent that year as Bṛhannalā, teaching dance and music to Princess Uttarā.","The Bhagavad Gita has 700 verses in 18 chapters, spoken by Krishna to Arjuna on the battlefield.","The Gita is part of the Bhishma Parva, the sixth parva, told just as the war begins.","Savyasāchī means one who can draw a bow with the left hand as well as the right. Arjuna could shoot equally well with either hand.","Krishna’s conch is called Pāñchajanya. He blew it at the start of the war, as the Gita’s first chapter describes.","The Kurukshetra war lasted 18 days. Bhishma led the Kaurava army for the first ten of them.","An akṣauhiṇī is a huge army division of chariots, elephants, horsemen and foot soldiers. Eighteen akṣauhiṇīs fought at Kurukshetra.","Iti-ha-āsa means “so indeed it was”. The Ramayana and Mahabharata are called Itihāsas because they are told as events that truly took place.","Valmiki taught his poem to Lava and Kusha, Rama’s twin sons. They sang it in Rama’s court during the Ashvamedha yajna.","Abhimanyu was the son of Arjuna and Subhadra, Krishna’s sister. In the war he broke into the chakravyuha but did not know the way out.","Pleased by his vow, his father Shantanu gave Devavrata the boon of icchā-mṛtyu: death only when he chose. Bhishma waited on his bed of arrows for Uttarayana.","As a messenger of peace, Krishna asked Duryodhana for just five villages for the Pandavas. Duryodhana refused to give even as much land as a needle’s point."]};for(const a in Be)Be[a].forEach((e,t)=>{Ce[a]&&Ce[a][t]&&(Ce[a][t].k=e)});_({id:"itihasa",name:"Itihāsa Yātrā",iti:!0,target:10,blurb:"Questions and stories from the Ramayana and Mahabharata.",how:"Answer 10 questions from Valmiki’s Ramayana and Vyasa’s Mahabharata. Tap Kathā for the story or Pātra for the characters at any time. There is no timer.",fmt:a=>a+"/10",create(a){const e=a.iti||{u:"bala",lang:"en"},n="te"===e.lang,i=Ce[e.u]||Ce.bala,r=a.pick?a.pick("iti:"+e.u,i.length,10):Ba(i.map((a,e)=>e)).slice(0,10),h=r.map(a=>i[a]),l=h.length;let c=0,u=0,f=-1,m="ask",p=[],g=!1;const w=()=>{const e=h[c];p=Ba([[e.a,e.at],...e.w]),f=-1,m="ask",a.hud(`Praśna ${c+1}/${l} · ${u} ✓`)};w();const b=()=>{const e=Math.min(.33*a.h,n?250:210),t=12+e+12,s=a.h-t-52-22,o=Math.min(n?92:80,(s-24)/4),i="show"===m?3:2,r=(a.w-28-8*(i-1))/i,h=a.h-52-10,l="show"===m?["katha","patra","next"]:["katha","patra"];return{qb:{x:14,y:12,w:a.w-28,h:e},btns:p.map((e,n)=>({x:14,y:t+n*(o+8),w:a.w-28,h:o,l:e})),tools:l.map((a,e)=>({x:14+e*(r+8),y:h,w:r,h:52,k:a}))}},v=()=>{g||(g=!0,a.end({score:u,text:`${u} of ${l} answered correctly. Sādhu!`,xp:2*u+2}))};return{update(){},down(e,t){if(g)return;const s=b(),o=h[c],i=s.tools.find(a=>G(e,t,a));if(i)return a.sfx.tick(),void("katha"===i.k?a.info((a=>{const e=$e[a.ep],t="show"===m&&a.k?`<div class="rahasya" style="margin-bottom:6px"><span class="lbl">Uttaram · about this answer</span><p style="font-size:16px;line-height:1.45"><b>${a.a}${n&&a.at&&a.at!==a.a?' · <span class="te">'+a.at+"</span>":""}</b></p><p style="font-weight:600;font-size:16px;line-height:1.5">${a.k}</p></d
