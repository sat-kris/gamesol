da","అంగదుడు"],["Sugriva","సుగ్రీవుడు"],["Vibhishana","విభీషణుడు"]],"e_birth",[],"Shatrughna was Lakshmana’s twin, the son of Sumitra. His name means “destroyer of enemies”. He stayed with Bharata in Ayodhya while Rama was in the forest."),Ie("Which rakshasi did Rama defeat first, to protect Vishwamitra?","విశ్వామిత్రుని కోసం రాముడు మొదట ఏ రాక్షసిని సంహరించాడు?","Tataka","తాటక",[["Shurpanakha","శూర్పణఖ"],["Simhika","సింహిక"],["Surasa","సురస"]],"e_yajna",["vishwamitra","rama"],"Tataka troubled the sages of a forest on the way to Vishwamitra’s ashram. At the sage’s word, young Rama defeated her. It was his first battle."),Ie("Which woman was freed from a curse when Rama came to her hermitage?","రాముడు తన ఆశ్రమానికి రాగానే శాప విముక్తి పొందిన స్త్రీ ఎవరు?","Ahalya","అహల్య",[["Shabari","శబరి"],["Tara","తార"],["Urmila","ఊర్మిళ"]],"e_ahalya",["rama"],"Ahalya, wife of Sage Gautama, was cursed to live unseen in the hermitage, doing penance. When Rama arrived with Vishwamitra, her penance was complete and she shone again."),Ie("Who was the maid who turned Kaikeyi against Rama’s crowning?","రాముని పట్టాభిషేకానికి వ్యతిరేకంగా కైకేయిని మార్చిన దాసి ఎవరు?","Manthara","మంథర",[["Tataka","తాటక"],["Shurpanakha","శూర్పణఖ"],["Trijata","త్రిజట"]],"e_boons",["kaikeyi"],"Manthara was Kaikeyi’s old maid. She filled Kaikeyi with fear that Bharata would lose everything, and urged her to use her two boons."),Ie("Who ferried Rama, Sita and Lakshmana across the Ganga?","సీతారామలక్ష్మణులను గంగ దాటించినది ఎవరు?","Guha, king of the boatmen","గుహుడు",[["Hanuman","హనుమంతుడు"],["Jatayu","జటాయువు"],["Sugriva","సుగ్రీవుడు"]],"e_guha",["guha","rama"],"Guha, king of the Nishadas, was Rama’s dear friend. He welcomed Rama at Shringaverapura and arranged a boat to take the three of them across the Ganga."),Ie("Where did Rama, Sita and Lakshmana build their hut near the Godavari?","గోదావరి తీరంలో సీతారామలక్ష్మణులు పర్ణశాల ఎక్కడ కట్టుకున్నారు?","Panchavati","పంచవటి",[["Kishkindha","కిష్కింధ"],["Chitrakuta","చిత్రకూటం"],["Mithila","మిథిల"]],"e_shurpanakha",["lakshmana"],"On Sage Agastya’s advice, they settled at Panchavati by the Godavari river. Lakshmana built a lovely hut of leaves there. It was from Panchavati that Sita was taken."),Ie("Which rakshasi, Ravana’s sister, did Lakshmana punish when she attacked Sita?","సీతపై దాడి చేసిన ఏ రాక్షసిని లక్ష్మణుడు శిక్షించాడు?","Shurpanakha","శూర్పణఖ",[["Tataka","తాటక"],["Simhika","సింహిక"],["Manthara","మంథర"]],"e_shurpanakha",["shurpanakha","lakshmana"],"Shurpanakha, Ravana’s sister, wanted Rama as her husband. When refused, she rushed to attack Sita, and Lakshmana cut off her nose and ears to stop her."),Ie("Shurpanakha was the sister of whom?","శూర్పణఖ ఎవరి సోదరి?","Ravana","రావణుడు",[["Vali","వాలి"],["Maricha","మారీచుడు"],["Sugriva","సుగ్రీవుడు"]],"e_shurpanakha",["shurpanakha","ravana"],"Shurpanakha was Ravana’s sister. After Lakshmana punished her, she went to Ravana and praised Sita’s beauty, which led Ravana to plan Sita’s capture."),Ie("How many heads did Ravana have?","రావణునికి ఎన్ని తలలు?","10","10",[["5","5"],["7","7"],["100","100"]],"e_warr",["ravana"],"Ravana is called Dashagriva, “the ten-necked one”, and Dashanana, “the ten-faced one”. He was a great scholar and a mighty king, but his pride led to his fall."),Ie("Which vanara king became Rama’s friend and ally?","రామునికి మిత్రుడైన వానర రాజు ఎవరు?","Sugriva","సుగ్రీవుడు",[["Vali","వాలి"],["Angada","అంగదుడు"],["Jambavan","జాంబవంతుడు"]],"e_vali",["sugriva","rama"],"Hanuman brought Rama and Sugriva together. They swore friendship before a sacred fire: Rama would help Sugriva win back his kingdom, and Sugriva would help search for Sita."),Ie("Who was Sugriva’s powerful elder brother?","సుగ్రీవుని అన్న ఎవరు?","Vali","వాలి",[["Angada","అంగదుడు"],["Ravana","రావణుడు"],["Nala","నలుడు"]],"e_vali",["vali","sugriva"],"Vali, the mighty king of Kishkindha, had driven Sugriva away and taken his wife. Rama defeated Vali, and Sugriva became king."),Ie("What was the name of the vanara kingdom?","వానరుల రాజ్యం పేరు ఏమిటి?","Kishkindha","కిష్కింధ",[["Lanka","లంక"],["Mithila","మిథిల"],["Ayodhya","అయోధ్య"]],"e_vali",["sugriva"],"Kishkindha was the vanara kingdom in the hills and caves near the Pampa lake. The Kishkindha Kanda of the Ramayana is named after it."),Ie("Who reminded Hanuman of his great strength before the leap to Lanka?","లంకకు లంఘించే ముందు హనుమంతునికి అతని బలాన్ని గుర్తుచేసినది ఎవరు?","Jambavan","జాంబవంతుడు",[["Sugriva","సుగ్రీవుడు"],["Angada","అంగదుడు"],["Rama","రాముడు"]],"e_search",["jambavan","hanuman"],"The vanaras sat by the ocean, unsure who could cross it. Wise old Jambavan, king of the bears, told Hanuman of his birth and powers. Hanuman grew huge and got ready to leap."),Ie("Who was Vali’s son, who led the search party to the south?","దక్షిణ దిశ అన్వేషణకు నాయకత్వం వహించిన వాలి కుమారుడు ఎవరు?","Angada","అంగదుడు",[["Sugriva","సుగ్రీవుడు"],["Nala","నలుడు"],["Jambavan","జాంబవంతుడు"]],"e_search",["angada"],"Angada, Vali’s son, became crown prince under Sugriva. He led the southern search party with Hanuman and Jambavan, and later carried Rama’s message to Ravana’s court."),Ie("Who was Hanuman’s mother?","హనుమంతుని తల్లి ఎవరు?","Anjana","అంజనాదేవి",[["Tara","తార"],["Ruma","రుమ"],["Kausalya","కౌసల్య"]],"e_hanuman",["hanuman"],"Hanuman was born to Anjana and Vāyu, the wind god. That is why he is called Anjaneya (son of Anjana) and Pavanaputra (son of the wind)."),Ie("How did Hanuman cross the ocean to Lanka?","హనుమంతుడు సముద్రాన్ని ఎలా దాటాడు?","He leapt across it","ఒక్క లంఘనంతో",[["He swam","ఈదుకుంటూ"],["On a boat","పడవలో"],["Over the bridge","సేతువు మీద"]],"e_leap",["hanuman"],"Hanuman climbed Mount Mahendra, grew huge and leapt across the ocean in one great bound. The bridge was built only later, for the whole army."),Ie("Where was Sita kept in Lanka?","లంకలో సీతను ఎక్కడ ఉంచారు?","The Ashoka grove","అశోక వనం",[["Ravana’s palace","రావణుని అంతఃపురం"],["A prison tower","చెరసాల"],["A mountain cave","పర్వత గుహ"]],"e_leap",["sita"],"Ravana first showed Sita his palace, but she rejected him, so he had her kept in the Ashoka grove, guarded by rakshasis. Hanuman found her there under a śiṃśapā tree."),Ie("What did Hanuman do after the rakshasas set his tail on fire?","రాక్షసులు తోకకు నిప్పు పెట్టిన తర్వాత హనుమంతుడు ఏం చేశాడు?","Set Lanka on fire","లంకను దహించాడు",[["Ran away","పారిపోయాడు"],["Flew straight home","నేరుగా తిరిగి ఎగిరిపోయాడు"],["Asked Ravana for pardon","క్షమాపణ అడిగాడు"]],"e_lanka",["hanuman","ravana"],"Ravana ordered Hanuman’s tail to be set alight. By Agni’s grace the fire did not burn him. Hanuman leapt from roof to roof and set Lanka ablaze, then cooled his tail in the sea."),Ie("What did Hanuman bring from the Himalayas to heal Lakshmana?","లక్ష్మణుని కోసం హనుమంతుడు హిమాలయాల నుండి ఏం తెచ్చాడు?","A mountain of healing herbs","ఔషధ పర్వతం",[["Water from the Ganga","గంగాజలం"],["A golden deer","బంగారు లేడి"],["Honey","తేనె"]],"e_herb",["hanuman","lakshmana"],"Lakshmana lay struck down in battle. The vanara physician Sushena needed rare herbs from a Himalayan peak. Unsure which plant was which, Hanuman lifted the whole peak and flew back with it."),Ie("Which brother of Ravana left him and joined Rama?","రావణుని విడిచి రాముని పక్షాన చేరిన తమ్ముడు ఎవరు?","Vibhishana","విభీషణుడు",[["Kumbhakarna","కుంభకర్ణుడు"],["Indrajit","ఇంద్రజిత్తు"],["Kubera","కుబేరుడు"]],"e_warr",["vibhishana"],"Vibhishana told Ravana to return Sita and make peace. Ravana insulted him, so Vibhishana crossed the sea and asked Rama for shelter. Rama welcomed him at once."),Ie("Which giant brother of Ravana slept for months at a time?","నెలల తరబడి నిద్రపోయే రావణుని తమ్ముడు ఎవరు?","Kumbhakarna","కుంభకర్ణుడు",[["Vibhishana","విభీషణుడు"],["Maricha","మారీచుడు"],["Khara","ఖరుడు"]],"e_warr",["kumbhakarna"],"Kumbhakarna asked Brahma for a boon but, by a slip of the tongue, received long sleep. Woken for the war, he fought bravely for his brother and fell to Rama’s arrows."),Ie("Which son of Ravana fought hidden in the clouds?","మేఘాలలో దాక్కుని యుద్ధం చేసిన రావణుని కుమారుడు ఎవరు?","Indrajit","ఇంద్రజిత్తు",[["Akshakumara","అక్షకుమారుడు"],["Kumbhakarna","కుంభకర్ణుడు"],["Angada","అంగదుడు"]],"e_warr",["indrajit"],"Indrajit, also called Meghanada, once defeated Indra himself. He fought unseen from the sky with magic weapons, and was finally defeated by Lakshmana."),Ie("Who defeated Indrajit in battle?","ఇంద్రజిత్తును యుద్ధంలో సంహరించినది ఎవరు?","Lakshmana","లక్ష్మణుడు",[["Rama","రాముడు"],["Hanuman","హనుమంతుడు"],["Sugriva","సుగ్రీవుడు"]],"e_warr",["lakshmana","indrajit"],"Vibhishana led Lakshmana to the place where Indrajit was performing a secret rite. Lakshmana stopped the rite and, after a long duel, defeated him with a divine arrow."),Ie("Who became king of Lanka after Ravana?","రావణుని తర్వాత లంకకు రాజు ఎవరు?","Vibhishana","విభీషణుడు",[["Kumbhakarna","కుంభకర్ణుడు"],["Indrajit","ఇంద్రజిత్తు"],["Hanuman","హనుమంతుడు"]],"e_warr",["vibhishana"],"Rama had promised Vibhishana the throne when he first came for shelter. After the war, Lakshmana crowned Vibhishana king of Lanka."),Ie("How did Rama return to Ayodhya?","రాముడు అయోధ్యకు ఎలా తిరిగి వచ్చాడు?","In the flying chariot Pushpaka","పుష్పక విమానంలో",[["Indra’s chariot","ఇంద్రుని రథం"],["On Garuda","గరుడునిపై"],["On an elephant","ఏనుగుపై"]],"e_crown",["rama"],"Pushpaka was a wonderful flying chariot that Ravana had taken from his brother Kubera. Vibhishana offered it to Rama, who flew home in it with Sita, Lakshmana and his friends."),Ie("Who flew ahead to tell Bharata that Rama was coming home?","రాముడు వస్తున్నాడని భరతునికి ముందుగా చెప్పినది ఎవరు?","Hanuman","హనుమంతుడు",[["Angada","అంగదుడు"],["Guha","గుహుడు"],["Jatayu","జటాయువు"]],"e_crown",["hanuman","bharata"],"Bharata had vowed to give up his life if Rama did not return on time. Rama sent Hanuman ahead with the happy news, and Bharata’s joy knew no bounds."),Ie("In whose ashram were Rama’s sons Lava and Kusha raised?","లవకుశులు ఎవరి ఆశ్రమంలో పెరిగారు?","Valmiki’s","వాల్మీకి మహర్షి",[["Vasishtha’s","వసిష్ఠ మహర్షి"],["Vishwamitra’s","విశ్వామిత్ర మహర్షి"],["Agastya’s","అగస్త్య మహర్షి"]],"e_lava",["valmiki","lavakusha"],"Lava and Kusha were born and grew up in Valmiki’s ashram by the Tamasa river. The sage taught them the Ramayana, which they sang beautifully."),Ie("Rama was a prince of which royal line?","శ్రీరాముడు ఏ వంశానికి చెందిన రాకుమారుడు?","The Ikshvaku line","ఇక్ష్వాకు వంశం",[["The Kuru line","కురు వంశం"],["The Yadu line","యదు వంశం"],["The Lunar line","చంద్ర వంశం"]],"e_birth",["rama"],"Rama belonged to the Ikshvaku line, also called the Solar line (Sūrya vaṃśa) or Raghu vaṃśa, after his great ancestor Raghu. That is why he is called Rāghava."),Ie("Which kind sage told Rama to live at Panchavati?","పంచవటిలో నివసించమని రామునికి సూచించిన మహర్షి ఎవరు?","Agastya","అగస్త్యుడు",[["Vishwamitra","విశ్వామిత్రుడు"],["Valmiki","వాల్మీకి"],["Gautama","గౌతముడు"]],"e_shurpanakha",["agastya"],"In the forest, Rama visited the great sage Agastya. Agastya blessed him, gave him divine weapons, and suggested the pleasant spot of Panchavati by the Godavari."),Ie("Who was the mother of the Pandavas Yudhishthira, Bhima and Arjuna?","యుధిష్ఠిర, భీమ, అర్జునుల తల్లి ఎవరు?","Kunti","కుంతి",[["Gandhari","గాంధారి"],["Madri","మాద్రి"],["Draupadi","ద్రౌపది"]],"e_kuru",["kunti"],"Kunti, wife of King Pandu, was the mother of the three eldest Pandavas. She had received a mantra from Sage Durvasa that let her call on the devas for sons."),Ie("Who was the eldest of the Kaurava brothers?","కౌరవులలో పెద్దవాడు ఎవరు?","Duryodhana","దుర్యోధనుడు",[["Dushasana","దుశ్శాసనుడు"],["Karna","కర్ణుడు"],["Shakuni","శకుని"]],"e_kuru",["duryodhana"],"Duryodhana was the eldest son of Dhritarashtra and Gandhari. His jealousy of the Pandavas grew from childhood and led, in the end, to the great war."),Ie("How many Kaurava brothers were there?","కౌరవులు ఎంతమంది?","100","100",[["5","5"],["50","50"],["1,000","1,000"]],"e_kuru",["gandhari"],"Gandhari was blessed with a hundred sons. They were called the Kauravas, descendants of Kuru. They also had one sister, Duhshala."),Ie("Who was the blind king, father of the Kauravas?","కౌరవుల తండ్రి అయిన అంధ రాజు ఎవరు?","Dhritarashtra","ధృతరాష్ట్రుడు",[["Pandu","పాండురాజు"],["Shantanu","శంతనుడు"],["Virata","విరాటుడు"]],"e_kuru",["dhritarashtra"],"Dhritarashtra was born blind. So his younger brother Pandu ruled first. After Pandu went to the forest, Dhritarashtra became king in Hastinapura."),Ie("Which queen tied a cloth over her eyes because her husband was blind?","భర్త అంధుడని తన కళ్లకు గంతలు కట్టుకున్న రాణి ఎవరు?","Gandhari","గాంధారి",[["Kunti","కుంతి"],["Madri","మాద్రి"],["Satyavati","సత్యవతి"]],"e_kuru",["gandhari"],"When Gandhari learned her husband Dhritarashtra was blind, she bound her own eyes and chose to share his darkness all her life."),Ie("Which Pandava was the strongest, and loved his food?","పాండవులలో అత్యంత బలవంతుడు, భోజనప్రియుడు ఎవరు?","Bhima","భీముడు",[["Arjuna","అర్జునుడు"],["Nakula","నకులుడు"],["Yudhishthira","యుధిష్ఠిరుడు"]],"e_kuru",["bhima"],"Bhima, son of Vāyu, had enormous strength and a huge appetite. He was also called Vṛkodara, “wolf-bellied”. He fought with a mace."),Ie("Which two Pandavas were twins?","పాండవులలో కవలలు ఎవరు?","Nakula and Sahadeva","నకుల సహదేవులు",[["Bhima and Arjuna","భీమార్జునులు"],["Arjuna and Nakula","అర్జున నకులులు"],["Yudhishthira and Bhima","ధర్మ భీములు"]],"e_kuru",[],"Nakula and Sahadeva were the twin sons of Pandu’s second queen, Madri, born by the blessing of the twin Ashvin devas. Nakula was famed for his looks and horses, Sahadeva for his wisdom."),Ie("Who was the mother of the twins Nakula and Sahadeva?","నకుల సహదేవుల తల్లి ఎవరు?","Madri","మాద్రి",[["Kunti","కుంతి"],["Gandhari","గాంధారి"],["Subhadra","సుభద్ర"]],"e_kuru",[],"Madri was King Pandu’s second wife. Kunti shared her mantra with Madri, and Madri called on the Ashvins, who blessed her with the twins."),Ie("Who taught archery to both the Pandavas and the Kauravas?","పాండవులకు, కౌరవులకు విలువిద్య నేర్పినది ఎవరు?","Drona","ద్రోణాచార్యుడు",[["Bhishma","భీష్ముడు"],["Vidura","విదురుడు"],["Krishna","కృష్ణుడు"]],"e_eye",["drona"],"Dronacharya, a brahmin master of weapons, became the teacher of the Kuru princes. Arjuna became his favourite student."),Ie("Which forest boy gave his thumb to Drona as guru dakshina?","గురుదక్షిణగా ద్రోణునికి బొటనవేలు ఇచ్చిన బాలుడు ఎవరు?","Ekalavya","ఏకలవ్యుడు",[["Karna","కర్ణుడు"],["Abhimanyu","అభిమన్యుడు"],["Ghatotkacha","ఘటోత్కచుడు"]],"e_ekalavya",["ekalavya","drona"],"Ekalavya made a clay image of Drona and practised alone until he became a superb archer. When Drona asked for his right thumb as guru dakshina, he gave it without hesitation."),Ie("Who was Draupadi’s father?","ద్రౌపది తండ్రి ఎవరు?","King Drupada","ద్రుపద మహారాజు",[["King Virata","విరాట రాజు"],["King Janaka","జనక మహారాజు"],["Dhritarashtra","ధృతరాష్ట్రుడు"]],"e_swayamvara",["draupadi"],"Draupadi was the daughter of King Drupada of Panchala. That is why she is also called Pāñchālī."),Ie("At Draupadi’s swayamvara, what did Arjuna have to do?","ద్రౌపది స్వయంవరంలో అర్జునుడు ఏం చేయాల్సి వచ్చింది?","String a mighty bow and hit a high target","మహాధనుస్సు ఎక్కుపెట్టి పైనున్న లక్ష్యాన్ని కొట్టడం",[["Win a wrestling match","మల్లయుద్ధం గెలవడం"],["Answer riddles","ప్రశ్నలకు జవాబులు"],["Win a chariot race","రథ పందెం గెలవడం"]],"e_swayamvara",["arjuna","draupadi"],"Drupada set a test: string a very hard bow and shoot a target high up, through a moving device. Many kings failed. Arjuna, disguised as a brahmin, did it easily."),Ie("In which game did Yudhishthira lose his kingdom?","యుధిష్ఠిరుడు తన రాజ్యాన్ని ఏ ఆటలో ఓడిపోయాడు?","A game of dice","జూదం (పాచికలు)",[["Chess","చదరంగం"],["A chariot race","రథ పందెం"],["An archery contest","విలువిద్య పోటీ"]],"e_dice",["yudhishthira"],"Duryodhana invited Yudhishthira to a game of dice. Shakuni threw for the Kauravas with tricks, and Yudhishthira lost his wealth, kingdom, brothers and even Draupadi."),Ie("Who threw the dice for Duryodhana?","దుర్యోధనుని తరఫున పాచికలు వేసినది ఎవరు?","Shakuni","శకుని",[["Karna","కర్ణుడు"],["Dushasana","దుశ్శాసనుడు"],["Drona","ద్రోణుడు"]],"e_dice",["shakuni"],"Shakuni, Gandhari’s brother and Duryodhana’s uncle, was a master of dice. He played on Duryodhana’s behalf and won every throw."),Ie("How long was the Pandavas’ exile in all?","పాండవుల వనవాసం మొత్తం ఎంతకాలం?","13 years","13 సంవత్సరాలు",[["14 years","14 సంవత్సరాలు"],["12 years","12 సంవత్సరాలు"],["7 years","7 సంవత్సరాలు"]],"e_virata",["yudhishthira"],"After the second game of dice, the Pandavas had to spend 12 years in the forest and a 13th year in hiding. If found in that last year, they would have to start again."),Ie("Where was the great war fought?","మహాయుద్ధం ఎక్కడ జరిగింది?","Kurukshetra","కురుక్షేత్రం",[["Hastinapura","హస్తినాపురం"],["Indraprastha","ఇంద్రప్రస్థం"],["Dwaraka","ద్వారక"]],"e_gita",[],"The war was fought on the plain of Kurukshetra, a holy field of the Kuru family. The Gita begins with the words “dharma-kṣetre kuru-kṣetre”."),Ie("The Kauravas built a house of which material to trap the Pandavas?","పాండవులను చిక్కించుకోవడానికి కౌరవులు ఏ పదార్థంతో ఇల్లు కట్టించారు?","Lac, which burns easily","లక్క (లాక్షాగృహం)",[["Stone","రాయి"],["Gold","బంగారం"],["Ice","మంచు"]],"e_lac",["duryodhana"],"Duryodhana had a palace built of lac and other things that burn easily at Varanavata, planning to set it on fire with the Pandavas inside. It is called the lākṣāgṛha."),Ie("Who secretly warned the Pandavas about the house of lac?","లక్క ఇంటి గురించి పాండవులను రహస్యంగా హెచ్చరించినది ఎవరు?","Vidura","విదురుడు",[["Bhishma","భీష్ముడు"],["Krishna","కృష్ణుడు"],["Drona","ద్రోణుడు"]],"e_lac",["vidura"],"Wise Vidura, the Pandavas’ uncle, warned Yudhishthira in a hidden way and sent a miner to dig a tunnel. The Pandavas and Kunti escaped through it when the house burned."),Ie("Who was Bhima’s son, a mighty rakshasa warrior?","భీముని కుమారుడైన మహా రాక్షస వీరుడు ఎవరు?","Ghatotkacha","ఘటోత్కచుడు",[["Abhimanyu","అభిమన్యుడు"],["Babhruvahana","బభ్రువాహనుడు"],["Iravan","ఇరావంతుడు"]],"e_kuru",["ghatotkacha","bhima"],"Ghatotkacha was the son of Bhima and Hidimbi. He fought fiercely for the Pandavas in the war, especially at night, until Karna used a special weapon against him."),Ie("Karna was born wearing what?","కర్ణుడు పుట్టుకతోనే ఏం ధరించి ఉన్నాడు?","Golden armour and earrings","కవచ కుండలాలు",[["A crown","కిరీటం"],["A garland","పూలమాల"],["A bow","ధనుస్సు"]],"e_karna",["karna"],"Karna was Kunti’s son by Surya, the sun god, born before her marriage. He was born with shining armour (kavacha) and earrings (kuṇḍala) that protected him."),Ie("To whom did Karna give away his armour and earrings?","కర్ణుడు తన కవచ కుండలాలను ఎవరికి దానం చేశాడు?","Indra","ఇంద్రుడు",[["Krishna","కృష్ణుడు"],["Arjuna","అర్జునుడు"],["Drona","ద్రోణుడు"]],"e_karna",["karna"],"Indra came to Karna disguised as a brahmin and asked for his armour and earrings. Though warned, Karna never refused a gift, and cut them off and gave them away."),Ie("Abhimanyu was trapped inside which battle formation?","అభిమన్యుడు ఏ వ్యూహంలో చిక్కుకున్నాడు?","The chakravyuha","చక్రవ్యూహం",[["The fish formation","మత్స్య వ్యూహం"],["The eagle formation","గరుడ వ్యూహం"],["The crane formation","క్రౌంచ వ్యూహం"]],"e_chakra",["abhimanyu"],"Drona arranged his army in the chakravyuha, a wheel-shaped formation. Young Abhimanyu broke in, but the others could not follow, and he fought alone against many warriors."),Ie("What was Krishna’s city by the sea?","సముద్ర తీరంలో కృష్ణుని నగరం ఏది?","Dwaraka","ద్వారక",[["Mathura","మథుర"],["Hastinapura","హస్తినాపురం"],["Ayodhya","అయోధ్య"]],"e_peace",["krishna"],"Krishna and the Yadavas built the city of Dwaraka on the western sea coast. Arjuna married Krishna’s sister Subhadra there."),Ie("Which city did the Pandavas build as their capital?","పాండవులు తమ రాజధానిగా ఏ నగరాన్ని నిర్మించారు?","Indraprastha","ఇంద్రప్రస్థం",[["Hastinapura","హస్తినాపురం"],["Dwaraka","ద్వారక"],["Kashi","కాశీ"]],"e_dice",["yudhishthira"],"Dhritarashtra gave the Pandavas the wild land of Khandavaprastha. With Krishna’s help, they built the splendid city of Indraprastha there."),Ie("What was the capital of the Kuru kingdom?","కురు రాజ్య రాజధాని ఏది?","Hastinapura","హస్తినాపురం",[["Indraprastha","ఇంద్రప్రస్థం"],["Ayodhya","అయోధ్య"],["Dwaraka","ద్వారక"]],"e_kuru",["dhritarashtra"],"Hastinapura, on the Ganga, was the ancient capital of the Kurus, ruled by Shantanu, Pandu and Dhritarashtra. After the war, Yudhishthira was crowned there."),Ie("Whom did Bhima fight with maces at the very end of the war?","యుద్ధం చివరలో భీముడు ఎవరితో గదా యుద్ధం చేశాడు?","Duryodhana","దుర్యోధనుడు",[["Karna","కర్ణుడు"],["Drona","ద్రోణుడు"],["Shakuni","శకుని"]],"e_warm",["bhima","duryodhana"],"On the eighteenth day, Duryodhana hid in a lake. The Pandavas called him out, and he chose to fight Bhima with maces. Bhima struck his thigh and defeated him."),Ie("What did Krishna show Arjuna in the Bhagavad Gita?","భగవద్గీతలో కృష్ణుడు అర్జునునికి ఏం చూపించాడు?","His universal form (Vishvarupa)","విశ్వరూపం",[["A golden city","బంగారు నగరం"],["A magic bow","మాయా ధనుస్సు"],["His childhood home","తన బాల్య గృహం"]],"e_gita",["krishna","arjuna"],"In the eleventh chapter of the Gita, Krishna gave Arjuna divine sight and showed him his Vishvarupa, the whole universe within one form."),Ie("Who told the blind king Dhritarashtra everything that happened in the war?","యుద్ధంలో జరిగినదంతా ధృతరాష్ట్రునికి చెప్పినది ఎవరు?","Sanjaya","సంజయుడు",[["Vidura","విదురుడు"],["Vyasa","వ్యాసుడు"],["Bhishma","భీష్ముడు"]],"e_gita",["sanjaya"],"Sage Vyasa gave Sanjaya divine sight, so he could see the whole battlefield from the palace. He described the war, and the Gita, to Dhritarashtra."),Ie("Who lay on a bed of arrows after falling in battle?","యుద్ధంలో పడిపోయి అంపశయ్యపై పడుకున్నది ఎవరు?","Bhishma","భీష్ముడు",[["Drona","ద్రోణుడు"],["Karna","కర్ణుడు"],["Abhimanyu","అభిమన్యుడు"]],"e_bed",["bhishma"],"On the tenth day, Arjuna’s arrows brought Bhishma down. So many arrows held him that his body did not touch the ground. He lay on this bed of arrows, waiting for the right time to leave his body."),Ie("In the Ramayana, who were the vanaras?","రామాయణంలో వానరులు ఎవరు?","The forest monkey people who helped Rama","రామునికి సహాయం చేసిన వానర జాతి",[["Rakshasa soldiers","రాక్షస సైనికులు"],["Kings of Ayodhya","అయోధ్య రాజులు"],["River spirits","నదీ దేవతలు"]],"e_vali",["sugriva","hanuman"],"Vanaras were a people of the forests, like monkeys but able to speak and reason. Led by Sugriva and Hanuman, they searched for Sita and built the bridge."),Ie("What is an āśrama?","ఆశ్రమం అంటే ఏమిటి?","A sage’s hermitage in the forest","అడవిలో ఋషుల నివాసం",[["A royal palace","రాజభవనం"],["A battlefield","యుద్ధభూమి"],["A marketplace","సంత"]],"e_yajna",[],"An āśrama was a peaceful forest home where sages lived, prayed and taught students. Rama visited many āśramas, such as those of Vishwamitra, Agastya and Valmiki."),Ie("What does dharma mean?","ధర్మం అంటే ఏమిటి?","Doing what is right","సరైనది చేయడం",[["Winning at any cost","ఏదేమైనా గెలవడం"],["Collecting gold","బంగారం కూడబెట్టడం"],["Obeying only kings","రాజులకే లోబడటం"]],"e_yaksha",["yudhishthira"],"Dharma means right conduct and duty: truth, kindness and keeping one’s word. Both Itihāsas show heroes trying to follow dharma in hard situations."),Ie("What is guru dakshina?","గురుదక్షిణ అంటే ఏమిటి?","A gift to the teacher after learning","విద్య తర్వాత గురువుకు ఇచ్చే కానుక",[["A school fee paid first","ముందు కట్టే రుసుము"],["A prize for the best student","ఉత్తమ విద్యార్థికి బహుమతి"],["A royal tax","రాజపన్ను"]],"e_ekalavya",["drona"],"After finishing their studies, students offered their teacher a gift of thanks, called guru dakshina. Drona asked the Kuru princes to capture King Drupada as his dakshina."),Ie("What does the name “Pandava” mean?","“పాండవులు” అంటే అర్థం ఏమిటి?","Sons of Pandu","పాండురాజు కుమారులు",[["Sons of the Kurus","కురు వంశీయులు"],["Brave warriors","వీర యోధులు"],["Five brothers","ఐదుగురు సోదరులు"]],"e_kuru",[],"Pāṇḍava means “son of Pandu”. The five brothers were the sons of King Pandu. The Kauravas, sons of Dhritarashtra, were named after their ancestor Kuru.")],praudha:[Ie("Which sage performed the yajna that brought Dasharatha his sons?","దశరథునికి పుత్రులను ప్రసాదించిన యజ్ఞాన్ని ఏ మహర్షి నిర్వహించాడు?","Rishyashringa","ఋష్యశృంగుడు",[["Vasishtha","వసిష్ఠుడు"],["Vishwamitra","విశ్వామిత్రుడు"],["Agastya","అగస్త్యుడు"]],"e_birth",["dasharatha"],"After the Ashvamedha, the sage Rishyashringa performed the putrakāmeṣṭi yajna for Dasharatha, a rite for the birth of sons."),Ie("What did the divine being from the yajna fire give Dasharatha?","యజ్ఞాగ్ని నుండి వచ్చిన దివ్య పురుషుడు దశరథునికి ఏమిచ్చాడు?","A vessel of divine pāyasa","దివ్య పాయసపాత్ర",[["A golden bow","బంగారు ధనుస్సు"],["A jewel","రత్నం"],["A sacred thread","యజ్ఞోపవీతం"]],"e_birth",["dasharatha","kausalya"],"A radiant being rose from the fire holding a golden vessel of pāyasa. Dasharatha shared it among his three queens, and in time Rama, Bharata, Lakshmana and Shatrughna were born."),Ie("Who was the family priest (kulaguru) of the Ikshvakus?","ఇక్ష్వాకుల కులగురువు ఎవరు?","Vasishtha","వసిష్ఠుడు",[["Vishwamitra","విశ్వామిత్రుడు"],["Gautama","గౌతముడు"],["Bharadvaja","భరద్వాజుడు"]],"e_birth",[],"Sage Vasishtha was the royal priest and teacher of Ayodhya. He guided Dasharatha, taught the princes, and later crowned Rama."),Ie("Which two mantras did Vishwamitra teach Rama, so he would feel no hunger or tiredness?","ఆకలి, అలసట లేకుండా విశ్వామిత్రుడు రామునికి నేర్పిన మంత్రాలు ఏవి?","Bala and Atibala","బల, అతిబల",[["Gayatri and Savitri","గాయత్రి, సావిత్రి"],["Aditya Hridayam","ఆదిత్య హృదయం"],["Brahmastra and Agneyastra","బ్రహ్మాస్త్రం, ఆగ్నేయాస్త్రం"]],"e_yajna",["vishwamitra","rama"],"On the banks of the Sarayu, Vishwamitra taught Rama the vidyās Bala and Atibala. They kept him free of hunger, thirst and fatigue, and no one could attack him while asleep."),Ie("Whose penance brought the Ganga down from heaven to earth?","ఎవరి తపస్సు వల్ల గంగ భూమికి దిగి వచ్చింది?","Bhagiratha","భగీరథుడు",[["Sagara","సగరుడు"],["Dilipa","దిలీపుడు"],["Raghu","రఘువు"]],"e_ahalya",["vishwamitra"],"Vishwamitra told Rama this story of his ancestors. King Bhagiratha did great penance so the Ganga would descend and free the souls of his forefathers. Shiva caught her in his hair to soften her fall."),Ie("Who was Ahalya’s husband?","అహల్య భర్త ఎవరు?","Sage Gautama","గౌతమ మహర్షి",[["Sage Agastya","అగస్త్య మహర్షి"],["Sage Vasishtha","వసిష్ఠ మహర్షి"],["Sage Atri","అత్రి మహర్షి"]],"e_ahalya",[],"Ahalya was the wife of Sage Gautama. After Rama’s visit ended her curse, Gautama returned and they were together again."),Ie("Who angrily challenged Rama on the way home from his wedding?","వివాహం తర్వాత తిరిగి వెళ్తుండగా రాముని ఎదిరించినది ఎవరు?","Parashurama","పరశురాముడు",[["Ravana","రావణుడు"],["Vishwamitra","విశ్వామిత్రుడు"],["Vali","వాలి"]],"e_parashu",["parashurama","rama"],"Parashurama heard that Shiva’s bow was broken and came with the bow of Vishnu. Rama strung it at once. Parashurama saw Rama’s greatness and went back to his penance."),Ie("Janaka’s daughter Urmila married which prince?","జనకుని కుమార్తె ఊర్మిళ ఏ రాకుమారుని వివాహమాడింది?","Lakshmana","లక్ష్మణుడు",[["Bharata","భరతుడు"],["Shatrughna","శత్రుఘ్నుడు"],["Rama","రాముడు"]],"e_bow",["lakshmana"],"All four brothers married in Mithila on the same day: Rama married Sita, Lakshmana married Urmila, and Bharata and Shatrughna married Mandavi and Shrutakirti, daughters of Janaka’s brother Kushadhvaja."),Ie("From which village did Bharata rule while Rama was away?","రాముడు లేనప్పుడు భరతుడు ఏ గ్రామం నుండి పాలించాడు?","Nandigrama","నందిగ్రామం",[["Ayodhya palace","అయోధ్య రాజభవనం"],["Chitrakuta","చిత్రకూటం"],["Shringaverapura","శృంగిబేరపురం"]],"e_paduka",["bharata"],"Bharata would not live in the palace. He stayed at Nandigrama outside Ayodhya, dressed like a hermit, and ruled in the name of Rama’s sandals."),Ie("Where did Bharata meet Rama and beg him to return?","భరతుడు రాముని కలిసి తిరిగి రమ్మని ఎక్కడ వేడుకున్నాడు?","Chitrakuta","చిత్రకూటం",[["Panchavati","పంచవటి"],["Kishkindha","కిష్కింధ"],["Nandigrama","నందిగ్రామం"]],"e_paduka",["bharata","rama"],"Rama was living on the hill of Chitrakuta when Bharata arrived with the queens and the army. Rama refused to break his father’s word, and gave Bharata his sandals instead."),Ie("Which sage gave Rama the great bow of Vishnu and an unending quiver?","విష్ణు ధనుస్సును, అక్షయ తూణీరాలను రామునికి ఇచ్చిన మహర్షి ఎవరు?","Agastya","అగస్త్యుడు",[["Bharadvaja","భరద్వాజుడు"],["Atri","అత్రి"],["Sharabhanga","శరభంగుడు"]],"e_shurpanakha",["agastya"],"In the Aranya Kanda, Sage Agastya gave Rama a bow made by Vishwakarma for Vishnu, two quivers that never ran out of arrows, and a sword."),Ie("Who taught Rama the Āditya Hṛdayam hymn during the battle?","యుద్ధ సమయంలో రామునికి ఆదిత్య హృదయం ఉపదేశించినది ఎవరు?","Sage Agastya","అగస్త్య మహర్షి",[["Vibhishana","విభీషణుడు"],["Vasishtha","వసిష్ఠుడు"],["Hanuman","హనుమంతుడు"]],"e_ravana",["agastya","rama"],"As Rama stood tired before his final fight with Ravana, Agastya came and taught him the Āditya Hṛdayam, a hymn to the Sun. Rama recited it and felt fresh strength."),Ie("Which two rakshasa brothers attacked Rama at Janasthana?","జనస్థానంలో రామునిపై దాడి చేసిన రాక్షస సోదరులు ఎవరు?","Khara and Dushana","ఖర దూషణులు",[["Sunda and Upasunda","సుంద ఉపసుందులు"],["Madhu and Kaitabha","మధు కైటభులు"],["Maricha and Subahu","మారీచ సుబాహులు"]],"e_janasthana",["rama"],"After Shurpanakha was punished, her brothers Khara and Dushana came with a huge army. Rama fought alone and destroyed them all."),Ie("How many rakshasas did Rama defeat alone at Janasthana?","జనస్థానంలో రాముడు ఒంటరిగా ఎంతమంది రాక్షసులను సంహరించాడు?","14,000","14,000",[["1,000","1,000"],["100","100"],["1,00,000","1,00,000"]],"e_janasthana",["rama"],"Valmiki says Rama, fighting alone, destroyed fourteen thousand rakshasas of Janasthana, along with Khara, Dushana and Trishira. News of this reached Ravana."),Ie("Which headless being told Rama to seek Sugriva’s friendship?","సుగ్రీవునితో స్నేహం చేయమని రామునికి చెప్పిన తలలేని జీవి ఎవరు?","Kabandha","కబంధుడు",[["Jatayu","జటాయువు"],["Viradha","విరాధుడు"],["Sampati","సంపాతి"]],"e_kabandha",["rama"],"Kabandha was a cursed being with a mouth in his belly. Freed by Rama and Lakshmana, he regained his divine form and told Rama to go to Pampa and befriend Sugriva."),Ie("Near which lake did Rama first meet Hanuman?","రాముడు హనుమంతుని మొదట ఏ సరస్సు దగ్గర కలిశాడు?","Pampa","పంపా సరస్సు",[["Manasarovar","మానస సరోవరం"],["Pushkar","పుష్కర"],["Tamasa","తమసా"]],"e_hanuman",["hanuman","rama"],"Near the lake of Pampa, Sugriva saw two warriors and sent Hanuman, disguised as a brahmin, to find out who they were. Rama was struck by how perfectly Hanuman spoke."),Ie("On which hill did Sugriva hide from Vali?","వాలికి భయపడి సుగ్రీవుడు ఏ పర్వతంపై దాక్కున్నాడు?","Rishyamuka","ఋష్యమూకం",[["Mahendra","మహేంద్రగిరి"],["Chitrakuta","చిత్రకూటం"],["Malyavan","మాల్యవంతం"]],"e_vali",["sugriva"],"Sugriva lived on Rishyamuka hill with Hanuman and a few friends. It was the one place where Vali could not follow him."),Ie("Why could Vali not enter Rishyamuka hill?","వాలి ఋష్యమూక పర్వతంపై ఎందుకు అడుగుపెట్టలేకపోయాడు?","Sage Matanga had cursed him","మతంగ మహర్షి శాపం",[["Rama forbade him","రాముడు నిషేధించాడు"],["It was too high","చాలా ఎత్తైనది"],["Sugriva guarded it","సుగ్రీవుడు కాపలా"]],"e_vali",["vali"],"Vali had thrown the body of the buffalo-demon Dundubhi, and drops of blood fell on Sage Matanga’s hermitage. The sage cursed Vali to die if he ever set foot on that hill."),Ie("How did Rama show Sugriva his strength?","సుగ్రీవునికి రాముడు తన బలాన్ని ఎలా చూపించాడు?","One arrow pierced seven sala trees","ఒకే బాణంతో ఏడు సాల వృక్షాలను ఛేదించాడు",[["He lifted a mountain","పర్వతం ఎత్తాడు"],["He broke a bow","ధనుస్సు విరిచాడు"],["He crossed a river","నది దాటాడు"]],"e_vali",["rama","sugriva"],"Sugriva doubted anyone could beat Vali. Rama shot a single arrow that went through seven great sala trees in a row, and then through the hill beyond. Sugriva was convinced."),Ie("Who was Vali’s wise wife?","వాలి బుద్ధిమంతురాలైన భార్య ఎవరు?","Tara","తార",[["Ruma","రుమ"],["Mandodari","మండోదరి"],["Anjana","అంజన"]],"e_vali",["vali"],"Tara, known for her wisdom, warned Vali not to fight Sugriva a second time, because Rama was with him. Vali would not listen."),Ie("Why did the search for Sita wait for four months?","సీతాన్వేషణ నాలుగు నెలలు ఎందుకు ఆగింది?","The rainy season had begun","వర్షాకాలం మొదలైంది",[["Sugriva was ill","సుగ్రీవుడు అనారోగ్యంతో"],["Rama was fasting","రాముడు ఉపవాసం"],["The ocean was frozen","సముద్రం గడ్డకట్టింది"]],"e_search",["sugriva","lakshmana"],"The monsoon came soon after Sugriva was crowned, and no search was possible. Rama waited on Mount Prasravana. When Sugriva was slow to begin after the rains, an angry Lakshmana went to remind him."),Ie("From which mountain did Hanuman leap across the ocean?","హనుమంతుడు ఏ పర్వతం నుండి సముద్రాన్ని లంఘించాడు?","Mahendra","మహేంద్రగిరి",[["Rishyamuka","ఋష్యమూకం"],["Kailasa","కైలాసం"],["Meru","మేరు"]],"e_leap",["hanuman"],"Hanuman climbed Mount Mahendra by the southern sea. He pressed down so hard as he leapt that the mountain shook and streams burst from its rocks."),Ie("Which mountain rose from the sea to offer Hanuman a rest?","హనుమంతునికి విశ్రాంతి ఇవ్వడానికి సముద్రం నుండి పైకి లేచిన పర్వతం ఏది?","Mainaka","మైనాకుడు",[["Mahendra","మహేంద్రగిరి"],["Malaya","మలయ"],["Govardhana","గోవర్ధనం"]],"e_ocean",["hanuman"],"The Ocean asked Mount Mainaka, hidden under the waves, to rise and let Hanuman rest. Hanuman touched it with his hand in thanks but flew on, unwilling to stop before his task was done."),Ie("Which sea-rakshasi seized Hanuman by his shadow?","హనుమంతుని నీడను పట్టుకున్న సముద్ర రాక్షసి ఎవరు?","Simhika","సింహిక",[["Surasa","సురస"],["Tataka","తాటక"],["Trijata","త్రిజట"]],"e_ocean",["hanuman"],"Simhika could catch flying creatures by grabbing their shadows on the water. Hanuman shrank, entered her mouth and tore his way out, defeating her."),Ie("How did Hanuman pass Surasa, the mother of serpents, who blocked his way?","సర్పమాత సురసను హనుమంతుడు ఎలా దాటాడు?","He grew huge, then became tiny and slipped out of her mouth","పెద్దవాడై, తర్వాత చిన్నవాడై ఆమె నోటి నుండి బయటకు వచ్చాడు",[["He fought and killed her","ఆమెను చంపాడు"],["He flew around her","చుట్టూ ఎగిరి వెళ్ళాడు"],["He gave her a jewel","రత్నం ఇచ్చాడు"]],"e_ocean",["hanuman"],"The devas sent Surasa to test Hanuman. She opened her mouth wider and wider as he grew. Suddenly he became thumb-sized, darted in and out of her mouth, and she blessed him for his wit."),Ie("What did Sita give Hanuman to take back to Rama?","సీత రామునికి ఇమ్మని హనుమంతునికి ఏమిచ్చింది?","Her hair jewel (chūḍāmaṇi)","చూడామణి",[["Her ring","ఉంగరం"],["A lotus","పద్మం"],["A letter","లేఖ"]],"e_leap",["sita","hanuman"],"In return for Rama’s ring, Sita gave Hanuman her chūḍāmaṇi, a jewel worn in the hair, and told him a story only Rama would know, so Rama would believe him."),Ie("Which son of Ravana did Hanuman kill in the Ashoka grove fight?","అశోకవనంలో హనుమంతుడు సంహరించిన రావణ కుమారుడు ఎవరు?","Akshakumara","అక్షకుమారుడు",[["Indrajit","ఇంద్రజిత్తు"],["Atikaya","అతికాయుడు"],["Trishira","త్రిశిరుడు"]],"e_lanka",["hanuman"],"After meeting Sita, Hanuman wrecked the grove to draw out Ravana’s warriors. He defeated many, including Ravana’s young son Akshakumara."),Ie("Which weapon did Indrajit use to bind Hanuman?","హనుమంతుని బంధించడానికి ఇంద్రజిత్తు ఏ అస్త్రం ప్రయోగించాడు?","The Brahmastra","బ్రహ్మాస్త్రం",[["A serpent noose","నాగపాశం"],["Varuna’s noose","వరుణపాశం"],["Iron chains","ఇనుప గొలుసులు"]],"e_lanka",["indrajit","hanuman"],"Out of respect for Brahma, Hanuman let the Brahmastra bind him, because he wanted to meet Ravana face to face. When the rakshasas added ropes, the weapon’s hold fell away."),Ie("Who was Ravana’s chief queen?","రావణుని పట్టపురాణి ఎవరు?","Mandodari","మండోదరి",[["Tara","తార"],["Shurpanakha","శూర్పణఖ"],["Trijata","త్రిజట"]],"e_warr",["ravana"],"Mandodari was Ravana’s virtuous chief queen and the mother of Indrajit. Hanuman at first mistook her for Sita because of her beauty and grace."),Ie("Who was Ravana’s father?","రావణుని తండ్రి ఎవరు?","Sage Vishrava","విశ్రవసు మహర్షి",[["Sage Pulastya","పులస్త్య మహర్షి"],["Sumali","సుమాలి"],["Kubera","కుబేరుడు"]],"e_warr",["ravana"],"Ravana was the son of the sage Vishrava and the rakshasi Kaikasi, and a grandson of Sage Pulastya. That is why he is called Paulastya."),Ie("From whom did Ravana take Lanka and the Pushpaka chariot?","లంకను, పుష్పక విమానాన్ని రావణుడు ఎవరి నుండి లాక్కున్నాడు?","His half-brother Kubera","సవతి సోదరుడు కుబేరుడు",[["Indra","ఇంద్రుడు"],["Vali","వాలి"],["Yama","యముడు"]],"e_warr",["ravana"],"Kubera, lord of wealth, first ruled Lanka. Ravana drove him out, took the city and seized his flying chariot, Pushpaka."),Ie("Which vanara physician knew the healing herbs?","ఔషధాల గురించి తెలిసిన వానర వైద్యుడు ఎవరు?","Sushena","సుషేణుడు",[["Nila","నీలుడు"],["Dvivida","ద్వివిదుడు"],["Gavaksha","గవాక్షుడు"]],"e_herb",["lakshmana"],"Sushena, Tara’s father, was the vanaras’ healer. He named herbs like Viśalyakaraṇī and Sañjīvakaraṇī that Hanuman should bring to heal Lakshmana."),Ie("Who drove the chariot that Indra sent for Rama?","ఇంద్రుడు రాముని కోసం పంపిన రథాన్ని నడిపినది ఎవరు?","Matali","మాతలి",[["Sumantra","సుమంత్రుడు"],["Aruna","అరుణుడు"],["Garuda","గరుడుడు"]],"e_ravana",["rama"],"For the final battle, Indra sent his own chariot, driven by his charioteer Matali. Matali also reminded Rama to use the Brahmastra against Ravana."),Ie("Which weapon finally ended Ravana?","చివరకు రావణుని ఏ అస్త్రం సంహరించింది?","The Brahmastra given by Agastya","అగస్త్యుడిచ్చిన బ్రహ్మాస్త్రం",[["Shiva’s trident","శివుని త్రిశూలం"],["A mace","గద"],["Indra’s thunderbolt","వజ్రాయుధం"]],"e_ravana",["rama","ravana"],"Ravana’s heads grew back each time they were cut. On Matali’s advice, Rama invoked the Brahmastra that Agastya had given him, and it struck Ravana in the chest."),Ie("Which deva brought Sita safely out of the fire?","సీతను అగ్ని నుండి క్షేమంగా తెచ్చిన దేవుడు ఎవరు?","Agni","అగ్నిదేవుడు",[["Indra","ఇంద్రుడు"],["Varuna","వరుణుడు"],["Vayu","వాయువు"]],"e_crown",["sita"],"After the war, Sita entered a fire to prove her purity. Agni himself rose from the flames carrying her unharmed and declared her pure before everyone."),Ie("According to Valmiki, how many verses does the Ramayana have?","వాల్మీకి రామాయణంలో ఎన్ని శ్లోకాలు ఉన్నాయి?","24,000","24,000",[["1,00,000","1,00,000"],["700","700"],["10,000","10,000"]],"e_lava",["valmiki"],"Valmiki’s Ramayana has about 24,000 ślokas in seven kāṇḍas. Tradition links each thousand verses with one syllable of the Gayatri mantra."),Ie("Which demon did Shatrughna defeat, founding the city of Madhura?","ఏ రాక్షసుని సంహరించి శత్రుఘ్నుడు మధుర నగరాన్ని స్థాపించాడు?","Lavana","లవణాసురుడు",[["Khara","ఖరుడు"],["Maricha","మారీచుడు"],["Viradha","విరాధుడు"]],"e_lava",[],"In the Uttara Kanda, the sages asked Rama for protection from Lavana, son of Madhu. Shatrughna went, defeated Lavana, and founded the city of Madhura (Mathura)."),Ie("Who was the rakshasi in the Ashoka grove who dreamed of Ravana’s fall and was kind to Sita?","అశోకవనంలో రావణుని పతనం కలలో చూసి సీతపై దయ చూపిన రాక్షసి ఎవరు?","Trijata","త్రిజట",[["Surasa","సురస"],["Simhika","సింహిక"],["Shurpanakha","శూర్పణఖ"]],"e_lanka",["sita"],"When the guards threatened Sita, the old rakshasi Trijata told them of her dream: Rama victorious and Ravana ruined. She urged them to treat Sita kindly."),Ie("What was the name of Dasharatha’s charioteer and minister?","దశరథుని సారథి, మంత్రి పేరు ఏమిటి?","Sumantra","సుమంత్రుడు",[["Matali","మాతలి"],["Guha","గుహుడు"],["Vasishtha","వసిష్ఠుడు"]],"e_guha",["dasharatha"],"Sumantra drove Rama, Sita and Lakshmana out of Ayodhya to the forest. He returned to the grieving king with an empty chariot."),Ie("The Mahabharata calls itself by which name in the verse “jayo nāmetihāso’yam”?","‘జయో నామేతిహాసోఽయమ్’ అనే శ్లోకంలో మహాభారతం తనను ఏ పేరుతో పిలుచుకుంటుంది?","Jaya","జయ",[["Puranasamhita","పురాణసంహిత"],["Harivamsha","హరివంశం"],["Itihasa Purana","ఇతిహాస పురాణం"]],"e_vyasa",["vyasa"],"The epic calls itself “Jaya”, meaning victory. Tradition says it grew from Jaya to Bhārata, and then to the great Mahābhārata."),Ie("Who first recited the Mahabharata at King Janamejaya’s snake sacrifice?","జనమేజయుని సర్పయాగంలో మహాభారతాన్ని మొదట చెప్పినది ఎవరు?","Vaishampayana","వైశంపాయనుడు",[["Sanjaya","సంజయుడు"],["Vyasa himself","వ్యాసుడే"],["Narada","నారదుడు"]],"e_vyasa",["vyasa"],"At Janamejaya’s great snake sacrifice, Vyasa asked his student Vaishampayana to tell the whole story of the Kurus. That telling is the Mahabharata we hear."),Ie("Who told the Mahabharata to the sages in the Naimisha forest?","నైమిశారణ్యంలో ఋషులకు మహాభారతాన్ని చెప్పినది ఎవరు?","Ugrashravas (Sauti)","ఉగ్రశ్రవసుడు (సౌతి)",[["Vaishampayana","వైశంపాయనుడు"],["Shuka","శుకుడు"],["Markandeya","మార్కండేయుడు"]],"e_vyasa",[],"The Mahabharata opens with Ugrashravas, the son of a bard, arriving at the sages’ long sacrifice in Naimisha forest. He retells what he heard at Janamejaya’s sacrifice."),Ie("Janamejaya was the son of which king?","జనమేజయుడు ఏ రాజు కుమారుడు?","Parikshit","పరీక్షిత్తు",[["Abhimanyu","అభిమన్యుడు"],["Yudhishthira","యుధిష్ఠిరుడు"],["Shantanu","శంతనుడు"]],"e_vyasa",[],"Janamejaya was the son of King Parikshit, who was Abhimanyu’s son and Arjuna’s grandson. Parikshit died of a serpent’s bite, which led to Janamejaya’s snake sacrifice."),Ie("Why did Devavrata take his vow never to marry or rule?","దేవవ్రతుడు వివాహం, రాజ్యం వద్దని ప్రతిజ్ఞ ఎందుకు చేశాడు?","So his father could marry Satyavati","తండ్రి సత్యవతిని వివాహమాడేందుకు",[["To become a sage","మునిగా మారడానికి"],["To win a war","యుద్ధం గెలవడానికి"],["To obey Drona","ద్రోణుని మాట కోసం"]],"e_vow",["bhishma"],"King Shantanu loved Satyavati, but her father wanted her son to be king. Devavrata gave up the throne and vowed lifelong celibacy so no rival heir could arise. The devas called him Bhishma for this terrible vow."),Ie("Who was Vyasa’s mother?","వ్యాసుని తల్లి ఎవరు?","Satyavati","సత్యవతి",[["Ganga","గంగ"],["Kunti","కుంతి"],["Amba","అంబ"]],"e_vyasa",["vyasa"],"Satyavati, a fisherman’s daughter, had a son with Sage Parashara on an island in the Yamuna: Krishna Dvaipayana, later called Vyasa. She later married King Shantanu."),Ie("Which princess was reborn to bring about Bhishma’s fall?","భీష్ముని పతనానికి కారణమవడానికి పునర్జన్మ ఎత్తిన రాకుమారి ఎవరు?","Amba","అంబ",[["Ambika","అంబిక"],["Ambalika","అంబాలిక"],["Gandhari","గాంధారి"]],"e_amba",["bhishma","shikhandi"],"Bhishma carried off three princesses for his brother. Amba loved another king, but he rejected her. Blaming Bhishma, she did penance and was reborn as Shikhandi, who stood before Arjuna at Bhishma’s fall."),Ie("Which sage, taking the form of a deer, cursed King Pandu?","జింక రూపంలో పాండురాజును శపించిన ముని ఎవరు?","Kindama","కిందముడు",[["Durvasa","దుర్వాసుడు"],["Markandeya","మార్కండేయుడు"],["Parashara","పరాశరుడు"]],"e_kuru",[],"While hunting, Pandu shot a deer that was really the sage Kindama with his wife. The dying sage cursed him. Pandu gave up his throne and went to live in the forest."),Ie("Which sage gave Kunti the mantra to call upon the devas?","దేవతలను ఆహ్వానించే మంత్రాన్ని కుంతికి ఇచ్చిన ముని ఎవరు?","Durvasa","దుర్వాసుడు",[["Vyasa","వ్యాసుడు"],["Vasishtha","వసిష్ఠుడు"],["Narada","నారదుడు"]],"e_karna",["kunti"],"As a girl, Kunti served the short-tempered sage Durvasa so well that he gave her a mantra to call any deva. Curious, she tried it on Surya, and Karna was born."),Ie("Why is Karna called Rādheya?","కర్ణుని రాధేయుడు అని ఎందుకు అంటారు?","He was raised by Radha","రాధ పెంచింది కాబట్టి",[["He loved Krishna","కృష్ణుని ప్రేమించాడు"],["He was born in Radha’s land","రాధ దేశంలో పుట్టాడు"],["His guru was Radha","గురువు రాధ"]],"e_karna",["karna"],"Kunti set baby Karna afloat in a basket. He was found by the charioteer Adhiratha and his wife Radha, who raised him as their own. So he is Rādheya, “son of Radha”."),Ie("Who taught Karna, and later cursed him to forget a weapon when he needed it most?","కర్ణునికి విద్య నేర్పి, తర్వాత అవసరమైనప్పుడు అస్త్రం మరచిపోయేలా శపించిన గురువు ఎవరు?","Parashurama","పరశురాముడు",[["Drona","ద్రోణుడు"],["Kripa","కృపుడు"],["Bhishma","భీష్ముడు"]],"e_karna",["karna","parashurama"],"Karna learned from Parashurama by saying he was a brahmin. When the truth came out, the guru cursed him to forget the Brahmastra at the moment of greatest need."),Ie("Which kingdom did Duryodhana give Karna?","దుర్యోధనుడు కర్ణునికి ఏ రాజ్యాన్ని ఇచ్చాడు?","Anga","అంగ రాజ్యం",[["Kalinga","కళింగ"],["Magadha","మగధ"],["Panchala","పాంచాల"]],"e_karna",["karna","duryodhana"],"At the tournament, Karna was mocked as a charioteer’s son and not allowed to face Arjuna. Duryodhana crowned him king of Anga on the spot, and they became lifelong friends."),Ie("Who was Drona’s son?","ద్రోణుని కుమారుడు ఎవరు?","Ashwatthama","అశ్వత్థామ",[["Kripa","కృపుడు"],["Dhrishtadyumna","ధృష్టద్యుమ్నుడు"],["Vikarna","వికర్ణుడు"]],"e_warm",["ashwatthama","drona"],"Ashwatthama was Drona’s beloved only son. He was named for the horse-like cry he gave at birth, and was said to have a jewel on his forehead."),Ie("What guru dakshina did Drona ask from the Kuru princes?","కురు రాకుమారుల నుండి ద్రోణుడు ఏ గురుదక్షిణ కోరాడు?","Capture King Drupada","ద్రుపదుని బంధించి తేవడం",[["A hundred cows","వంద ఆవులు"],["A golden throne","బంగారు సింహాసనం"],["Arjuna’s bow","అర్జునుని ధనుస్సు"]],"e_ekalavya",["drona","arjuna"],"Drupada, once Drona’s friend, had insulted him. Drona asked his students to capture Drupada. Arjuna did it, and Drona took half of Drupada’s kingdom."),Ie("How were Draupadi and her brother Dhrishtadyumna born?","ద్రౌపది, ధృష్టద్యుమ్నుడు ఎలా జన్మించారు?","From a sacred fire","యజ్ఞకుండం నుండి",[["From a lotus","పద్మం నుండి"],["From the ocean","సముద్రం నుండి"],["From a furrow","నాగలి చాలు నుండి"]],"e_swayamvara",["draupadi"],"Drupada performed a yajna for a son who could defeat Drona. Dhrishtadyumna rose from the fire in armour, and then Draupadi rose from the altar. She is also called Yājñasenī, daughter of Yajñasena, which is another name of Drupada."),Ie("Who was Arjuna’s son with the princess Chitrangada?","చిత్రాంగదకు, అర్జునునికి కలిగిన కుమారుడు ఎవరు?","Babhruvahana","బభ్రువాహనుడు",[["Abhimanyu","అభిమన్యుడు"],["Iravan","ఇరావంతుడు"],["Ghatotkacha","ఘటోత్కచుడు"]],"e_forest",["arjuna"],"During his travels, Arjuna married Chitrangada of Manipura. Their son Babhruvahana stayed to rule Manipura, and later even faced his father in battle during the Ashvamedha."),Ie("Whom did Krishna kill at Yudhishthira’s Rajasuya sacrifice?","యుధిష్ఠిరుని రాజసూయ యాగంలో కృష్ణుడు ఎవరిని సంహరించాడు?","Shishupala","శిశుపాలుడు",[["Jarasandha","జరాసంధుడు"],["Kamsa","కంసుడు"],["Duryodhana","దుర్యోధనుడు"]],"e_rajasuya",["krishna"],"When Krishna was honoured first at the Rajasuya, Shishupala insulted him again and again. After forgiving a hundred offences as he had promised, Krishna struck him down with his discus."),Ie("How many offences had Krishna promised to forgive Shishupala?","శిశుపాలుని ఎన్ని తప్పులను క్షమిస్తానని కృష్ణుడు మాట ఇచ్చాడు?","100","100",[["10","10"],["7","7"],["1,000","1,000"]],"e_rajasuya",["krishna"],"Shishupala’s mother, Krishna’s aunt, begged Krishna to spare her son. Krishna promised to forgive him a hundred offences. The hundred and first came at the Rajasuya."),Ie("Who defeated King Jarasandha in a wrestling match?","జరాసంధుని మల్లయుద్ధంలో ఓడించినది ఎవరు?","Bhima","భీముడు",[["Arjuna","అర్జునుడు"],["Krishna","కృష్ణుడు"],["Karna","కర్ణుడు"]],"e_rajasuya",["bhima"],"Before the Rajasuya, Krishna, Bhima and Arjuna went to Magadha. Jarasandha chose to wrestle Bhima. They fought for days until Bhima tore him in two."),Ie("Who built the Pandavas’ wondrous assembly hall?","పాండవుల అద్భుత సభను నిర్మించినది ఎవరు?","Maya, the asura architect","మయుడు",[["Vishwakarma","విశ్వకర్మ"],["Nala","నలుడు"],["Kubera","కుబేరుడు"]],"e_rajasuya",["arjuna"],"Arjuna spared Maya’s life during the burning of the Khandava forest. In gratitude, Maya built the Maya Sabha, a hall so full of illusions that Duryodhana mistook floor for water and water for floor."),Ie("Who gave Yudhishthira the akṣaya pātra, a vessel that never ran out of food?","యుధిష్ఠిరునికి అక్షయపాత్రను ఇచ్చినది ఎవరు?","Surya, the sun god","సూర్యుడు",[["Indra","ఇంద్రుడు"],["Krishna","కృష్ణుడు"],["Vyasa","వ్యాసుడు"]],"e_forest",["yudhishthira"],"In the forest, many brahmins followed the Pandavas. Yudhishthira prayed to Surya, who gave him a vessel that provided food each day until Draupadi had eaten."),Ie("Which god, disguised as a hunter, gave Arjuna the Pashupata weapon?","కిరాతుని రూపంలో అర్జునునికి పాశుపతాస్త్రం ఇచ్చిన దేవుడు ఎవరు?","Shiva","శివుడు",[["Indra","ఇంద్రుడు"],["Vishnu","విష్ణువు"],["Agni","అగ్ని"]],"e_forest",["arjuna"],"Arjuna did penance in the Himalayas. Shiva came as a Kirata hunter and fought him over a boar they both shot. Pleased with Arjuna’s courage, Shiva revealed himself and gave him the Pāśupata."),Ie("Bhima met Hanuman while searching for which flower?","ఏ పుష్పం కోసం వెతుకుతుండగా భీముడు హనుమంతుని కలిశాడు?","Saugandhika","సౌగంధిక పుష్పం",[["Lotus of Brahma","బ్రహ్మకమలం"],["Parijata","పారిజాతం"],["Champaka","చంపకం"]],"e_forest",["bhima","hanuman"],"Draupadi wished for more of the fragrant Saugandhika flowers. On the way, Bhima found an old monkey whose tail he could not lift: it was Hanuman, his elder brother, also a son of Vāyu."),Ie("Who told Yudhishthira the story of Nala and Damayanti?","నల దమయంతుల కథను యుధిష్ఠిరునికి చెప్పినది ఎవరు?","Sage Brihadashva","బృహదశ్వ మహర్షి",[["Vyasa","వ్యాసుడు"],["Narada","నారదుడు"],["Markandeya","మార్కండేయుడు"]],"e_forest",["yudhishthira"],"Yudhishthira felt no one had suffered as he had. Sage Brihadashva told him of King Nala, who also lost his kingdom at dice and later won it back, and taught him the secret of dice."),Ie("Who won her husband’s life back from Yama?","యముని నుండి తన భర్త ప్రాణాలను తిరిగి పొందినది ఎవరు?","Savitri","సావిత్రి",[["Damayanti","దమయంతి"],["Sita","సీత"],["Draupadi","ద్రౌపది"]],"e_forest",[],"Markandeya told the Pandavas this story. Savitri followed Yama as he took her husband Satyavan’s life, and her wisdom and devotion won his life back."),Ie("Whom did Bhima kill in King Virata’s palace for troubling Draupadi?","ద్రౌపదిని బాధించినందుకు విరాట రాజభవనంలో భీముడు ఎవరిని సంహరించాడు?","Kichaka","కీచకుడు",[["Jayadratha","జయద్రథుడు"],["Dushasana","దుశ్శాసనుడు"],["Susharma","సుశర్మ"]],"e_virata",["bhima","draupadi"],"Kichaka, the queen’s powerful brother, harassed Draupadi, who was disguised as a maid. Bhima waited for him in the dark dance hall and killed him."),Ie("What name did Yudhishthira use in Virata’s court?","విరాట సభలో యుధిష్ఠిరుడు ఏ పేరు పెట్టుకున్నాడు?","Kanka","కంకుభట్టు",[["Vallabha","వల్లభుడు"],["Granthika","గ్రంథికుడు"],["Tantipala","తంతిపాలుడు"]],"e_virata",["yudhishthira"],"Yudhishthira served as Kanka, a brahmin companion who played dice with the king. Bhima was the cook Vallabha, Nakula the horse-keeper Granthika, and Sahadeva the cowherd Tantipala."),Ie("What role did Draupadi take in Virata’s palace?","విరాట రాజభవనంలో ద్రౌపది ఏ పాత్రలో ఉంది?","Sairandhri, the queen’s maid","సైరంధ్రి (రాణి దాసి)",[["A dancer","నర్తకి"],["A cook","వంటమనిషి"],["A priestess","పూజారిణి"]],"e_virata",["draupadi"],"Draupadi became Sairandhri, a maid who dressed the hair of Queen Sudeshna. She said her Gandharva husbands protected her, but Kichaka would not stay away."),Ie("Whom did Abhimanyu marry?","అభిమన్యుడు ఎవరిని వివాహమాడాడు?","Uttara, King Virata’s daughter","విరాట రాజు కుమార్తె ఉత్తర",[["Hidimbi","హిడింబి"],["Chitrangada","చిత్రాంగద"],["Ulupi","ఉలూపి"]],"e_virata",["abhimanyu"],"When the disguise ended, Virata offered his daughter Uttara to Arjuna. Arjuna, her teacher, asked that she marry his son Abhimanyu instead. Their son was Parikshit."),Ie("Before the war, Arjuna chose Krishna. What did Duryodhana choose?","యుద్ధానికి ముందు అర్జునుడు కృష్ణుని ఎంచుకున్నాడు. దుర్యోధనుడు ఏం ఎంచుకున్నాడు?","Krishna’s great army, the Narayani Sena","కృష్ణుని నారాయణీ సేన",[["Balarama","బలరాముడు"],["Krishna’s chariot","కృష్ణుని రథం"],["Dwaraka’s treasure","ద్వారక సంపద"]],"e_choice",["krishna","arjuna","duryodhana"],"Both came to Krishna for help. Krishna offered himself, unarmed, or his army of a hundred million warriors. Arjuna chose Krishna alone. Duryodhana happily took the army."),Ie("Who led the Kaurava army after Bhishma fell?","భీష్ముడు పడిపోయిన తర్వాత కౌరవ సేనకు నాయకుడు ఎవరు?","Drona","ద్రోణుడు",[["Karna","కర్ణుడు"],["Shalya","శల్యుడు"],["Ashwatthama","అశ్వత్థామ"]],"e_warm",["drona"],"Bhishma led for ten days, Drona for five, Karna for two, and Shalya on the last day. Drona took command on the eleventh day."),Ie("Who drove Karna’s chariot in his last battle?","చివరి యుద్ధంలో కర్ణుని రథసారథి ఎవరు?","Shalya","శల్యుడు",[["Adhiratha","అధిరథుడు"],["Shakuni","శకుని"],["Kripa","కృపుడు"]],"e_warm",["karna"],"Shalya, the Pandava twins’ uncle, was tricked into joining the Kauravas. As Karna’s charioteer, he kept praising Arjuna to weaken Karna’s spirit, as he had promised Yudhishthira."),Ie("To make Drona lay down his weapons, the Pandavas killed an elephant with what name?","ద్రోణుడు ఆయుధాలు వదిలేలా పాండవులు ఏ పేరుగల ఏనుగును చంపారు?","Ashwatthama","అశ్వత్థామ",[["Airavata","ఐరావతం"],["Supratika","సుప్రతీకం"],["Gajendra","గజేంద్రుడు"]],"e_warm",["drona","yudhishthira"],"Bhima killed an elephant named Ashwatthama and shouted that Ashwatthama was dead. Drona asked truthful Yudhishthira, who said “Ashwatthama is dead”, adding softly “the elephant”. Heartbroken, Drona put down his arms."),Ie("Who killed Drona?","ద్రోణుని సంహరించినది ఎవరు?","Dhrishtadyumna","ధృష్టద్యుమ్నుడు",[["Arjuna","అర్జునుడు"],["Bhima","భీముడు"],["Shikhandi","శిఖండి"]],"e_warm",["drona"],"Dhrishtadyumna, born from Drupada’s fire to defeat Drona, struck him down as Drona sat in meditation after laying down his weapons."),Ie("Who stood in front of Arjuna so that Bhishma would not fight back?","భీష్ముడు ఎదురుదాడి చేయకుండా అర్జునుని ముందు నిలిచినది ఎవరు?","Shikhandi","శిఖండి",[["Bhima","భీముడు"],["Krishna","కృష్ణుడు"],["Dhrishtadyumna","ధృష్టద్యుమ్నుడు"]],"e_bed",["shikhandi","bhishma"],"Bhishma had vowed never to fight Shikhandi, who had been born a woman (Amba reborn). With Shikhandi in front, Arjuna shot Bhishma, who let the arrows come."),Ie("Which weapon did Karna use to kill Ghatotkacha?","ఘటోత్కచుని సంహరించడానికి కర్ణుడు ఏ ఆయుధం వాడాడు?","Indra’s Vasavi shakti","ఇంద్రుడిచ్చిన వాసవీ శక్తి",[["The Brahmastra","బ్రహ్మాస్త్రం"],["The Pashupata","పాశుపతం"],["The Sudarshana","సుదర్శనం"]],"e_warm",["karna","ghatotkacha"],"In return for his armour, Indra gave Karna a spear that would surely kill one foe. Karna saved it for Arjuna, but had to use it on Ghatotkacha during a desperate night battle."),Ie("How did Karna die?","కర్ణుడు ఎలా మరణించాడు?","Arjuna struck him while his chariot wheel was stuck","రథచక్రం భూమిలో కూరుకుపోయినప్పుడు అర్జునుని బాణానికి",[["A fall from his chariot","రథం నుండి పడి"],["Bhima’s mace","భీముని గద"],["A snake bite","పాముకాటు"]],"e_warm",["karna","arjuna"],"On the seventeenth day, Karna’s chariot wheel sank into the earth, and his curse made him forget the Brahmastra. As he tried to free the wheel, Krishna urged Arjuna to shoot."),Ie("Bhishma’s long teachings to Yudhishthira after the war fill which parva?","యుద్ధం తర్వాత భీష్ముడు యుధిష్ఠిరునికి చేసిన బోధలు ఏ పర్వంలో ఉన్నాయి?","Shanti Parva","శాంతి పర్వం",[["Adi Parva","ఆది పర్వం"],["Vana Parva","వన పర్వం"],["Drona Parva","ద్రోణ పర్వం"]],"e_bed",["bhishma","yudhishthira"],"Grieving after the war, Yudhishthira went to Bhishma on his bed of arrows. Bhishma taught him about kingship, dharma and liberation. These teachings form the Shanti and Anushasana Parvas."),Ie("The Vishnu Sahasranama is found in which parva?","విష్ణు సహస్రనామం ఏ పర్వంలో ఉంది?","Anushasana Parva","అనుశాసనిక పర్వం",[["Bhishma Parva","భీష్మ పర్వం"],["Shanti Parva","శాంతి పర్వం"],["Adi Parva","ఆది పర్వం"]],"e_bed",["bhishma"],"When Yudhishthira asked which name of God one should chant, Bhishma, lying on his bed of arrows, recited the thousand names of Vishnu. It is in the Anushasana Parva."),Ie("Which animal followed Yudhishthira on the final journey to heaven?","స్వర్గారోహణ యాత్రలో యుధిష్ఠిరుని వెంట వచ్చిన జంతువు ఏది?","A dog","కుక్క",[["A horse","గుర్రం"],["A cow","ఆవు"],["An elephant","ఏనుగు"]],"e_end",["yudhishthira"],"On the Great Journey, the others fell one by one. Only a dog stayed with Yudhishthira. When Indra told him to leave it behind, he refused. The dog was Dharma himself, testing him."),Ie("How did Krishna leave this world?","కృష్ణుడు ఈ లోకాన్ని ఎలా విడిచాడు?","A hunter’s arrow struck his foot","వేటగాని బాణం పాదానికి తగిలి",[["He fell in battle","యుద్ధంలో"],["He drowned at sea","సముద్రంలో మునిగి"],["He grew old in Dwaraka","వృద్ధాప్యంతో"]],"e_end",["krishna"],"After the Yadavas destroyed each other, Krishna sat in the forest in meditation. A hunter named Jara mistook his foot for a deer and shot it. This is told in the Mausala Parva."),Ie("Who gave Sanjaya the divine sight to see the war?","యుద్ధాన్ని చూడటానికి సంజయునికి దివ్యదృష్టి ఇచ్చినది ఎవరు?","Vyasa","వ్యాసుడు",[["Krishna","కృష్ణుడు"],["Indra","ఇంద్రుడు"],["Bhishma","భీష్ముడు"]],"e_gita",["sanjaya","vyasa"],"Vyasa offered sight to Dhritarashtra himself, who refused to watch his family die. So Vyasa gave Sanjaya divine sight to see and report everything."),Ie("Who asks the first question of the Bhagavad Gita?","భగవద్గీతలో మొదటి ప్రశ్న అడిగినది ఎవరు?","Dhritarashtra","ధృతరాష్ట్రుడు",[["Arjuna","అర్జునుడు"],["Sanjaya","సంజయుడు"],["Yudhishthira","యుధిష్ఠిరుడు"]],"e_gita",["dhritarashtra","sanjaya"],"The Gita begins with blind Dhritarashtra asking Sanjaya: “On the field of dharma, at Kurukshetra, what did my sons and the sons of Pandu do?”"),Ie("Who was Duryodhana’s brother that dragged Draupadi into the hall?","ద్రౌపదిని సభలోకి ఈడ్చుకొచ్చిన దుర్యోధనుని తమ్ముడు ఎవరు?","Dushasana","దుశ్శాసనుడు",[["Vikarna","వికర్ణుడు"],["Karna","కర్ణుడు"],["Shakuni","శకుని"]],"e_dice",["draupadi","bhima"],"After Draupadi was staked and lost, Dushasana dragged her into the assembly by her hair. Bhima vowed to defeat him in battle, and fulfilled that vow in the war."),Ie("Which Kaurava brother spoke up for Draupadi in the dice hall?","జూదసభలో ద్రౌపది పక్షాన మాట్లాడిన కౌరవ సోదరుడు ఎవరు?","Vikarna","వికర్ణుడు",[["Dushasana","దుశ్శాసనుడు"],["Duryodhana","దుర్యోధనుడు"],["Yuyutsu","యుయుత్సుడు"]],"e_dice",["draupadi"],"When the elders were silent, young Vikarna argued that Draupadi had not been fairly won, since Yudhishthira had already lost himself. Karna scolded him into silence."),Ie("Which son of Dhritarashtra switched to the Pandava side before the war?","యుద్ధానికి ముందు పాండవుల పక్షానికి మారిన ధృతరాష్ట్రుని కుమారుడు ఎవరు?","Yuyutsu","యుయుత్సుడు",[["Vikarna","వికర్ణుడు"],["Dushasana","దుశ్శాసనుడు"],["Sukarna","సుకర్ణుడు"]],"e_choice",["yudhishthira"],"Just before the battle, Yudhishthira invited anyone to join the side of dharma. Yuyutsu, Dhritarashtra’s son by a vaishya woman who served in the palace, crossed over. He survived the war."),Ie("What is a swayamvara?","స్వయంవరం అంటే ఏమిటి?","A ceremony where a princess chooses her husband","రాకుమారి తన భర్తను ఎంచుకునే వేడుక",[["A coronation","పట్టాభిషేకం"],["A horse sacrifice","అశ్వమేధం"],["A battle vow","యుద్ధ ప్రతిజ్ఞ"]],"e_swayamvara",["draupadi"],"Svayam-vara means “one’s own choice”. Often there was a test of skill, as at Draupadi’s swayamvara, where Arjuna won by his archery."),Ie("What does “Rāmāyaṇa” mean?","“రామాయణం” అంటే అర్థం ఏమిటి?","Rama’s journey","రాముని యాత్ర (అయనం)",[["Rama’s kingdom","రాముని రాజ్యం"],["Rama’s war","రాముని యుద్ధం"],["Praise of Rama","రాముని స్తుతి"]],"e_krauncha",["rama"],"Rāma + ayana, “journey” or “way”. The poem follows Rama’s journey from Ayodhya to the forest, to Lanka and home again."),Ie("What does “Mahābhārata” mean?","“మహాభారతం” అంటే అర్థం ఏమిటి?","The great story of the Bharata dynasty","భరత వంశపు మహా కథ",[["The great war","మహా యుద్ధం"],["Great India","మహా భారతదేశం"],["The great teacher","మహా గురువు"]],"e_vyasa",["vyasa"],"It tells the story of the descendants of King Bharata, son of Dushyanta and Shakuntala. The Kurus and Pandavas both belonged to this line."),Ie("What metre is a śloka written in?","శ్లోకం ఏ ఛందస్సులో ఉంటుంది?","Anuṣṭubh, 32 syllables","అనుష్టుప్ (32 అక్షరాలు)",[["Gāyatrī, 24 syllables","గాయత్రి (24 అక్షరాలు)"],["Triṣṭubh, 44 syllables","త్రిష్టుప్ (44 అక్షరాలు)"],["Free verse","ఛందస్సు లేదు"]],"e_krauncha",["valmiki"],"Valmiki’s first śloka was in the anuṣṭubh metre: four quarters of eight syllables each. Most of both Itihāsas are composed in this metre."),Ie("What is an Ashvamedha?","అశ్వమేధం అంటే ఏమిటి?","A royal horse sacrifice","రాజులు చేసే అశ్వ యాగం",[["A chariot race","రథ పందెం"],["A cavalry battle","అశ్వ యుద్ధం"],["A horse festival","గుర్రాల పండుగ"]],"e_lava",["rama","yudhishthira"],"In an Ashvamedha, a horse roamed freely for a year, and kings who let it pass accepted the performer as emperor. Dasharatha, Rama and Yudhishthira all performed it.")]};Object.assign($e,{e_birth:{t:"The birth of four princes",tt:"నలుగురు రాకుమారుల జననం",src:"Bala Kanda",book:Ae,s:"King Dasharatha of Ayodhya had no children. After an Ashvamedha, the sage Rishyashringa performed a yajna for sons. A radiant being rose from the fire with a vessel of divine pāyasa, which the king shared with his queens Kausalya, Kaikeyi and Sumitra. Rama, Bharata, Lakshmana and Shatrughna were born, and grew up under the guidance of Sage Vasishtha."},e_ahalya:{t:"Ganga’s descent and Ahalya",tt:"గంగావతరణం, అహల్య",src:"Bala Kanda",book:Ae,s:"On the way to Mithila, Vishwamitra told the princes many stories. One was how King Bhagiratha’s penance brought the Ganga down from heaven, with Shiva catching her in his hair. At Sage Gautama’s empty hermitage, Rama’s arrival ended Ahalya’s long, unseen penance, and she shone again."},e_parashu:{t:"Parashurama’s challenge",tt:"పరశురాముని సవాలు",src:"Bala Kanda",book:Ae,s:"As the wedding party returned from Mithila, the fierce Parashurama appeared. Angry that Shiva’s bow was broken, he handed Rama the bow of Vishnu. Rama strung it at once and set an arrow to it. Parashurama recognised Rama’s greatness and returned to his penance."},e_guha:{t:"Leaving Ayodhya",tt:"అయోధ్య విడిచి",src:"Ayodhya Kanda",book:Ae,s:"Sumantra drove Rama, Sita and Lakshmana out of the weeping city. At Shringaverapura, Guha, king of the Nishada boatmen, welcomed his friend with love. The next morning he ferried them across the Ganga, and they walked on towards Chitrakuta."},e_shurpanakha:{t:"Panchavati and Shurpanakha",tt:"పంచవటి, శూర్పణఖ",src:"Aranya Kanda",book:Ae,s:"Sage Agastya gave Rama divine weapons and sent him to Panchavati by the Godavari. There Ravana’s sister Shurpanakha came and wanted Rama for herself. When refused, she attacked Sita, and Lakshmana cut off her nose and ears. She fled to her brothers, and then to Ravana."},e_janasthana:{t:"The battle of Janasthana",tt:"జనస్థాన యుద్ధం",src:"Aranya Kanda",book:Ae,s:"Shurpanakha’s brothers Khara and Dushana came with fourteen thousand rakshasas. Rama sent Sita and Lakshmana to a cave and faced them alone. With a storm of arrows he destroyed the whole army. The news reached Ravana in Lanka."},e_kabandha:{t:"Kabandha’s advice",tt:"కబంధుని సలహా",src:"Aranya Kanda",book:Ae,s:"Searching for Sita, the brothers were seized by Kabandha, a headless monster with long arms and a mouth in his belly. They cut off his arms and cremated him, freeing him from a curse. In his true form he told Rama to befriend Sugriva at Pampa."},e_vali:{t:"Friendship with Sugriva",tt:"సుగ్రీవ మైత్రి",src:"Kishkindha Kanda",book:Ae,s:"Hanuman brought Rama to Sugriva on Rishyamuka hill. They swore friendship before a fire. Rama proved his strength by piercing seven sala trees with one arrow. In the fight between the brothers, Rama struck down Vali, and Sugriva became king of Kishkindha, with Angada as crown prince."},e_search:{t:"The search for Sita",tt:"సీతాన్వేషణ",src:"Kishkindha Kanda",book:Ae,s:"After the rains, Sugriva sent search parties in all four directions. Angada, Hanuman and Jambavan went south. Sampati told them Sita was in Lanka, across the ocean. Jambavan reminded Hanuman of his strength, and Hanuman grew huge on Mount Mahendra."},e_ocean:{t:"Across the ocean",tt:"సముద్ర లంఘనం",src:"Sundara Kanda",book:Ae,s:"Hanuman flew over the sea. Mount Mainaka rose to offer him rest. Surasa, sent to test him, blocked his path, and he tricked her by growing huge and then tiny. Simhika caught his shadow, and he defeated her. At last he landed on the shores of Lanka."},e_lanka:{t:"Hanuman in Lanka",tt:"లంకలో హనుమంతుడు",src:"Sundara Kanda",book:Ae,s:"After meeting Sita, Hanuman broke up the Ashoka grove and defeated the warriors sent against him, including young Akshakumara. Indrajit bound him with the Brahmastra and took him to Ravana. When the rakshasas set his tail on fire, Hanuman set Lanka ablaze and flew home."},e_warr:{t:"Ravana’s family and the war",tt:"రావణ కుటుంబం, యుద్ధం",src:"Yuddha Kanda",book:Ae,s:"Vibhishana begged Ravana to return Sita, was insulted, and joined Rama. The vanaras crossed the setu. Kumbhakarna was woken to fight and fell. Indrajit, who fought hidden in the clouds, was defeated by Lakshmana. After Ravana fell, Vibhishana was crowned king of Lanka."},e_herb:{t:"The mountain of herbs",tt:"సంజీవని పర్వతం",src:"Yuddha Kanda",book:Ae,s:"Hanuman made this journey twice. When Indrajit’s Brahmastra struck down Rama, Lakshmana and the army, Jambavan sent him to the Himalayas for healing herbs. Later, when Ravana’s spear struck Lakshmana, the healer Sushena named the herbs. Each time, unable to tell the plants apart, Hanuman lifted the whole peak and carried it back."},e_ravana:{t:"The fall of Ravana",tt:"రావణ సంహారం",src:"Yuddha Kanda",book:Ae,s:"Indra sent his chariot with Matali to carry Rama. Weary before the final fight, Rama received the Āditya Hṛdayam from Sage Agastya. Ravana’s heads grew back each time they were cut, so Rama used the Brahmastra that Agastya had given him, and Ravana fell."},e_kuru:{t:"The Kuru family",tt:"కురు వంశం",src:"Adi Parva",book:Te,s:"Blind Dhritarashtra and his queen Gandhari had a hundred sons, the Kauravas, led by Duryodhana. His brother Pandu, cursed by the sage Kindama, went to the forest. There his queens Kunti and Madri had five sons by the blessing of the devas: Yudhishthira, Bhima, Arjuna, Nakula and Sahadeva. The cousins grew up together in Hastinapura."},e_ekalavya:{t:"Ekalavya and Drona’s dakshina",tt:"ఏకలవ్యుడు, గురుదక్షిణ",src:"Adi Parva",book:Te,s:"Ekalavya, a Nishada prince, was turned away by Drona. He made a clay image of Drona and practised until he surpassed even Arjuna. Drona asked for his right thumb as guru dakshina, and Ekalavya gave it. When the Kuru princes finished, Drona asked them to capture Drupada, and Arjuna did."},e_karna:{t:"The story of Karna",tt:"కర్ణుని కథ",src:"Adi and Vana Parvas",book:Te,s:"Young Kunti tested Durvasa’s mantra on Surya and bore Karna, born with armour and earrings. Afraid, she set him afloat, and Adhiratha and Radha raised him. Learning from Parashurama, he was later cursed. Duryodhana made him king of Anga. Later, he gave his armour to Indra, who gave him the Vasavi shakti."},e_lac:{t:"The house of lac",tt:"లక్క ఇల్లు",src:"Adi Parva",book:Te,s:"Duryodhana sent the Pandavas and Kunti to Varanavata, where a house of lac had been built to burn them. Vidura warned Yudhishthira in coded words and sent a miner to dig a tunnel. The Pandavas escaped through it in the night as the house burned."},e_rajasuya:{t:"The Rajasuya",tt:"రాజసూయ యాగం",src:"Sabha Parva",book:Te,s:"Maya built the Pandavas a hall of wonders at Indraprastha. Before Yudhishthira’s Rajasuya, Bhima defeated Jarasandha of Magadha in a wrestling match. At the sacrifice, Krishna was honoured first, and when Shishupala’s insults passed a hundred, Krishna struck him down with his discus."},e_dice:{t:"The game of dice",tt:"జూదం",src:"Sabha Parva",book:Te,s:"Jealous of the Pandavas’ glory, Duryodhana invited Yudhishthira to play dice. Shakuni threw with tricks, and Yudhishthira lost everything, even Draupadi. Dushasana dragged her into the hall. Among Duryodhana’s brothers, only Vikarna spoke for her. After a second game, the Pandavas left for thirteen years of exile."},e_forest:{t:"Years in the forest",tt:"వనవాసం",src:"Vana Parva",book:Te,s:"In the forest, Surya gave Yudhishthira the akṣaya pātra. Arjuna won the Pāśupata from Shiva, who came as a hunter. Bhima met Hanuman while seeking the Saugandhika flower. Sages told the Pandavas many stories, like those of Nala and Damayanti and of Savitri, to give them hope."},e_amba:{t:"Amba and Shikhandi",tt:"అంబ, శిఖండి",src:"Udyoga Parva",book:Te,s:"Bhishma won the princesses Amba, Ambika and Ambalika for his brother. Amba loved King Shalva, who rejected her. Blaming Bhishma, she did fierce penance and was reborn as Drupada’s child Shikhandi. Bhishma would not fight Shikhandi, and this led to his fall."},e_choice:{t:"Krishna or his army",tt:"కృష్ణుడా, సేనా",src:"Udyoga Parva",book:Te,s:"Arjuna and Duryodhana both came to Dwaraka to ask Krishna’s help. Krishna offered himself, unarmed, to one side, and his Narayani army to the other. Arjuna chose Krishna. Duryodhana was glad to have the army. Just before the fighting, Yuyutsu crossed to the Pandava side."},e_warm:{t:"The eighteen days",tt:"పద్దెనిమిది రోజుల యుద్ధం",src:"Drona, Karna and Shalya Parvas",book:Te,s:"After Bhishma fell, Drona led the Kauravas. The Pandavas killed an elephant named Ashwatthama, and Drona laid down his arms and was slain by Dhrishtadyumna. Karna used the Vasavi shakti on Ghatotkacha, and later fell to Arjuna when his wheel stuck. On the last day, Bhima defeated Duryodhana in a mace fight."},e_end:{t:"The final journey",tt:"మహాప్రస్థానం",src:"Mausala and Mahaprasthanika Parvas",book:Te,s:"Years after the war, a hunter’s arrow ended Krishna’s life on earth. The Pandavas and Draupadi set out for the Himalayas. One by one they fell, until only Yudhishthira and a faithful dog remained. He refused to enter heaven without the dog, which was Dharma himself."}}),Object.assign(We,{dasharatha:["Dasharatha","దశరథుడు","King of Ayodhya and father of Rama, Bharata, Lakshmana and Shatrughna. He died of grief after Rama left for the forest."],kausalya:["Kausalya","కౌసల్య","Dasharatha’s eldest queen and the mother of Rama."],guha:["Guha","గుహుడు","King of the Nishada boatmen at Shringaverapura and a loving friend of Rama."],shurpanakha:["Shurpanakha","శూర్పణఖ","Ravana’s sister. Her quarrel with Rama and Lakshmana set off the events that led Ravana to take Sita."],vali:["Vali","వాలి","The mighty vanara king of Kishkindha, Sugriva’s elder brother. Rama struck him down to help Sugriva."],jambavan:["Jambavan","జాంబవంతుడు","The wise old king of the bears, who reminded Hanuman of his strength."],angada:["Angada","అంగదుడు","Vali’s son and Kishkindha’s crown prince. He led the southern search and was Rama’s messenger to Ravana."],vibhishana:["Vibhishana","విభీషణుడు","Ravana’s righteous younger brother who joined Rama and became king of Lanka."],kumbhakarna:["Kumbhakarna","కుంభకర్ణుడు","Ravana’s giant brother, who slept for months. He advised Ravana against war but fought for him loyally."],indrajit:["Indrajit","ఇంద్రజిత్తు","Ravana’s son, also called Meghanada. He once defeated Indra and fought with magic from the clouds."],agastya:["Agastya","అగస్త్యుడు","A great sage of the south. He gave Rama divine weapons and taught him the Āditya Hṛdayam."],parashurama:["Parashurama","పరశురాముడు","A fierce warrior-sage with an axe, teacher of Bhishma, Drona and Karna. He tested Rama with Vishnu’s bow."],kunti:["Kunti","కుంతి","Pandu’s queen, mother of Yudhishthira, Bhima, Arjuna and, secretly, Karna."],duryodhana:["Duryodhana","దుర్యోధనుడు","Eldest of the hundred Kaurava brothers. His jealousy of the Pandavas led to the war."],gandhari:["Gandhari","గాంధారి","Dhritarashtra’s queen and mother of the hundred Kauravas. She kept her eyes bound all her life."],dhritarashtra:["Dhritarashtra","ధృతరాష్ట్రుడు","The blind king of Hastinapura, father of the Kauravas."],bhima:["Bhima","భీముడు","Second Pandava, son of Vāyu, famous for his strength, his mace and his appetite."],ekalavya:["Ekalavya","ఏకలవ్యుడు","A Nishada prince who taught himself archery before an image of Drona, and gave his thumb as guru dakshina."],draupadi:["Draupadi","ద్రౌపది","Daughter of Drupada, born from a sacred fire, and wife of the five Pandavas. Also called Panchali and Yajnaseni."],shakuni:["Shakuni","శకుని","Gandhari’s brother, master of dice, who won Yudhishthira’s kingdom for Duryodhana."],vidura:["Vidura","విదురుడు","The wise half-brother of Dhritarashtra and Pandu, known for honest advice. He saved the Pandavas from the house of lac."],ghatotkacha:["Ghatotkacha","ఘటోత్కచుడు","Son of Bhima and Hidimbi, a mighty warrior who fought for the Pandavas."],karna:["Karna","కర్ణుడు","Kunti’s first son by Surya, raised by a charioteer. Famous for generosity and loyalty to Duryodhana."],sanjaya:["Sanjaya","సంజయుడు","Dhritarashtra’s charioteer and advisor, who narrated the war with divine sight."],shikhandi:["Shikhandi","శిఖండి","Drupada’s child, Amba reborn, before whom Bhishma would not raise his bow."],ashwatthama:["Ashwatthama","అశ్వత్థామ","Drona’s son, a fierce warrior on the Kaurava side."]});for(const a in Ee)Ce[a].push(...Ee[a]);const De="#FBFCFB",Ke={lanes:'<path d="M12 3v18" stroke-dasharray="2 2.5"/><circle cx="7" cy="17" r="2.4" fill="'+De+'"/><circle cx="17" cy="17" r="2.4" fill="'+De+'"/><rect x="5" y="4" width="4" height="4" rx="1" fill="currentColor"/><rect x="15" y="8" width="4" height="4" rx="1" fill="currentColor"/>',snake:'<path d="M3 17c3 0 3-5 6-5s3 5 6 5 5-3 5-8"/><circle cx="20" cy="6" r="1.8" fill="currentColor"/><circle cx="5" cy="7" r="1. at was hard and what got easier.</li><li><b>Parents’ phones too:</b> 46% of teens say a parent gets distracted by their phone while talking. Children notice what adults do.</li><li><b>Time outdoors:</b> each extra hour of daily screen time was linked to about 21% higher odds of short-sightedness.</li><li><b>Rest your eyes:</b> every 20 minutes, look at something far away for 20 seconds.</li><li><b>Make a family media plan</b> together, so everyone agrees on when and how screens are used.</li></ul>\n  <p class="small"><b>Young children:</b> the WHO recommends no screen time for babies under 1, and no more than 1 hour a day for children aged 2 to 4, with active play and good sleep being most important.</p>\n  <p class="small">Sources: ${rn("https://www.who.int/publications/i/item/9789241550536","WHO guidelines for children under 5")} · ${rn("https://publications.aap.org/pediatrics/article/154/6/e2024067417/199968/The-Family-Media-Plan","AAP: The Family Media Plan")} · ${rn("https://pmc.ncbi.nlm.nih.gov/articles/PMC11236742/","Short video use and attention (EEG study)")} · ${rn("https://www.tandfonline.com/doi/full/10.1080/02673843.2026.2623337","Short video use and thinking skills in youth: a review")} · ${rn("https://news.ki.se/using-social-media-may-impair-childrens-attention","Social media and attention: 4-year study")} · ${rn("https://pmc.ncbi.nlm.nih.gov/articles/PMC11939267/","Social media breaks: review of 20 trials")} · ${rn("https://www.hhs.gov/sites/default/files/sg-youth-mental-health-social-media-advisory.pdf","US Surgeon General advisory")} · ${rn("https://www.pewresearch.org/internet/2024/03/11/how-teens-and-parents-approach-screen-time/","Pew: teens, parents and screen time")} · ${rn("https://pubmed.ncbi.nlm.nih.gov/39982728/","Screen time and myopia")}</p>\n </details>\n <details class="box art"><summary><span class="lbl">Gamification for healthcare</span><h2>What research reports on games and health</h2></summary>\n  <p>Some games have been studied in clinical trials for specific conditions. Results are summarised below as reported by the studies.</p>\n  <ul>\n   <li><b>ADHD in children:</b> EndeavorRx was authorized by the US FDA in 2020 as a prescription device. In its main trial, scores on a computer attention test improved. Parent and clinician ratings of symptoms did not differ significantly. ${rn("https://www.accessdata.fda.gov/cdrh_docs/reviews/DEN200026.pdf","FDA summary")}</li>\n   <li><b>Amblyopia (lazy eye):</b> Luminopia, which uses modified shows viewed in a headset, was FDA-cleared in 2021. In its trial, vision in the weaker eye improved more than with glasses alone. Ages 8 to 12 were added in 2025. ${rn("https://www.healio.com/news/optometry/20250423/fda-clears-luminopia-for-amblyopia-in-children-aged-8-to-12-years-old","News")}</li>\n   <li><b>Teen depression:</b> in a randomised trial, SPARX, a game that teaches CBT skills, gave results similar to usual care. ${rn("https://pubmed.ncbi.nlm.nih.gov/22773784/","Study")}</li>\n   <li><b>After a traumatic event:</b> early trials reported fewer intrusive memories in the first week after playing Tetris as part of a clinical protocol. A larger repeat study across six sites did not find this one-week effect. ${rn("https://www.nature.com/articles/mp201723","Early study")} · ${rn("https://online.ucpress.edu/collabra/article/11/1/130791/207825/Evidence-That-Tetris-Reduces-Immediate-but-Not","Repeat study")}</li>\n   <li><b>Older adults:</b> in a 20-year follow-up of one trial (2026), participants who did speed training with booster sessions had about 25% fewer dementia diagnoses. The memory and reasoning training groups showed no difference. ${rn("https://www.hopkinsmedicine.org/news/newsroom/news-releases/2026/02/cognitive-speed-training-linked-to-lower-dementia-incidence-up-to-20-years-later","News")}</li>\n   <li><b>Stroke:</b> a review found game-based rehab improved arm function when added to usual therapy. It showed no difference when used instead of usual therapy. ${rn("https://www.cochrane.org/evidence/CD008349_virtual-reality-stroke-rehabilitation","Review")}</li>\n   <li><b>Falls in older adults:</b> a review of trials found balance exercise games were associated with fewer falls. ${rn("https://pmc.ncbi.nlm.nih.gov/articles/PMC13427072/","Review")}</li>\n   <li><b>Quitting smoking:</b> a review of trials found higher quit rates with gamified programmes. The difference was smaller at six months and later. ${rn("https://pmc.ncbi.nlm.nih.gov/articles/PMC12199787/","Review")}</li>\n   <li><b>Needle procedures in children:</b> a review found game and VR distraction was associated with lower reported pain and fear. ${rn("https://pmc.ncbi.nlm.nih.gov/articles/PMC11417701/","Review")}</li>\n  </ul>\n  <h3>Limits reported in research</h3>\n  <p>Reviews of general brain-training games report improvement mainly on the practised tasks and similar tasks, with limited evidence of effects on school results or IQ. ${rn("https://longevity.stanford.edu/1032016-do-brain-training-programs-work","Expert review")}</p>\n  <h3>About Pocket Plays</h3>\n  <p>Pocket Plays is for fun and focus skills practice. It has not been studied in clinical trials and is not a medical product. For health concerns, please consult a doctor.</p>\n </details>\n <p class="note" style="text-align:center;font-weight:800">Keep pocketing for more updates!</p>\n</div>`}function ln(){({play:Vt,score:Qt,rank:an,labs:on,learn:hn,cockpit:tn})[Kt]()}document.addEventListener("click",e=>{if(!a("#stage").hidden)return;const t=e.target.closest("[data-game]");if(t)return H()?void Gn(t.dataset.game):_e(t.dataset.game)&&_e(t.dataset.game).sp?(dn=t.dataset.game,void fn("Player")):void cn(!1,t.dataset.game);const n=e.target.closest("[data-act]");n&&cn("switch"===n.dataset.act)});let dn=null;function cn(t,n){dn=n||null;const s=Object.values($.players);a("#sheetTitle").textContent=s.length&&t?"Switch player":s.length?"Add a player":"Welcome to Pocket Plays",a("#cancelP").
